function sxRenderSettings(){if(!sxRequireLogin('/settings'))return '';return `<div class="customer-shell"><div class="customer-card"><div class="customer-head"><div><h1>Account settings</h1><p style="margin:4px 0;color:var(--ink-soft)">${esc(SX_CUSTOMER.email||'')}</p></div><button class="x-close" onclick="location.hash='/'">&times;</button></div><form onsubmit="event.preventDefault();sxSaveProfile(this)"><div class="form-grid-2"><div class="field"><label>Full name</label><input name="name" value="${esc(SX_PROFILE?.full_name||'')}" required></div><div class="field"><label>Phone number</label><input name="phone" value="${esc(SX_PROFILE?.phone||'')}" required></div></div><button class="btn small">Save account</button></form><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h3>Shipping addresses</h3>${SX_ADDRESSES.map(a=>`<div class="address-card ${a.is_default?'default':''}"><div style="display:flex;justify-content:space-between;gap:10px"><div><b>${esc(a.label)}</b> ${a.is_default?'<span class="status-badge confirmed">Default</span>':''}<div style="font-size:13px;margin-top:5px">${esc(a.receiver_name)} · ${esc(a.phone)}<br>${esc(a.address_line)}, ${esc(a.city)}, ${esc(a.province)} ${esc(a.postal_code||'')}</div></div><div style="display:flex;gap:6px"><button class="btn small ghost" onclick="sxAddressForm('${a.id}')">Edit</button><button class="btn small danger" onclick="sxDeleteAddress('${a.id}')">Delete</button></div></div></div>`).join('')}<button class="btn small ghost" onclick="sxAddressForm()">+ Add address</button><div style="margin-top:18px"><button class="btn secondary" onclick="sxLogout()">Log out</button></div></div></div>`}
function sxRenderCart(){return `<div class="customer-shell"><div class="customer-card"><div class="customer-head"><h1>Your cart</h1><button class="x-close" onclick="location.hash='/'">&times;</button></div>${SX_CART.length?`${SX_CART.map(x=>`<div class="cart-row"><img src="${esc(sxImage(sxProduct(x.productId))||x.image||'')}" alt=""><div><b>${esc(x.title)}</b><div style="font-size:12px;color:var(--ink-soft)">${fmtMoney(x.price)} each</div></div><div class="qty-control"><button onclick="sxUpdateQty('${x.productId}',${x.qty-1})">−</button><span>${x.qty}</span><button onclick="sxUpdateQty('${x.productId}',${x.qty+1})">+</button></div><div style="font-weight:800">${fmtMoney(x.price*x.qty)}</div></div>`).join('')}<div class="summary-line"><span>Subtotal</span><b>${fmtMoney(sxCartSubtotal())}</b></div><div class="summary-line"><span>Delivery</span><b>${fmtMoney(sxDeliveryCharge())}</b></div><div class="summary-line summary-total"><span>Total</span><b>${fmtMoney(sxCartTotal())}</b></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn" onclick="location.hash='/checkout'">Proceed to checkout</button><button class="btn ghost" onclick="sxClearCart()">Clear</button></div>`:`<div class="empty-state"><div class="icon">🛒</div><h3>Your cart is empty</h3><a href="#/category/all" class="btn small">Browse products</a></div>`}</div></div>`}
function sxRenderCheckout(){if(!sxRequireLogin('/checkout'))return '';const a=sxAddressDefault();return `<div class="customer-shell"><div class="container"><div class="customer-head"><div><h1>Checkout</h1><p style="color:var(--ink-soft)">Cash on Delivery · Delivered by TCS</p></div></div><div class="checkout-grid"><div class="customer-card" style="max-width:none"><h3>Delivery address</h3>${SX_ADDRESSES.length?`<div class="form-grid-2">${SX_ADDRESSES.map(x=>`<label class="address-card ${x.id===(a?.id)?'default':''}" style="cursor:pointer"><input type="radio" name="dummy" ${x.id===(a?.id)?'checked':''} onchange="document.querySelectorAll('[data-address-radio]').forEach(e=>e.checked=false);document.getElementById('checkout-address').value='${esc(x.id)}';this.checked=true" data-address-radio><b>${esc(x.label)}</b><div style="font-size:12px">${esc(x.receiver_name)} · ${esc(x.phone)}<br>${esc(x.address_line)}, ${esc(x.city)}, ${esc(x.province)}</div></label>`).join('')}</div><input type="hidden" id="checkout-address" value="${esc(a?.id||'')}"><button type="button" class="btn small ghost" onclick="sxAddressForm()">+ Add another address</button>`:`<div class="secure-note">No shipping address saved yet.</div><button type="button" class="btn small" onclick="sxAddressForm()">Add shipping address</button>`}<form id="checkout-form" onsubmit="event.preventDefault();const f=new FormData(this);f.set('address_id',document.getElementById('checkout-address')?.value||'');sxPlaceOrder(this);"><div class="field full" style="margin-top:16px"><label>Contact number for order confirmation</label><input name="contact_phone" type="tel" value="${esc(a?.phone||SX_PROFILE?.phone||'')}" required><div class="field-hint">You will be asked via this number to confirm your order. We may call or use WhatsApp.</div></div><div class="field full" style="margin-top:10px"><label>Order note (optional)</label><textarea name="note" placeholder="Any delivery instruction"></textarea></div><div class="secure-note">You will be asked via this number to confirm your order. We may call or contact you through WhatsApp before dispatch.</div><button class="btn" style="margin-top:14px;width:100%;justify-content:center" ${a?'':'disabled'}>Confirm order · Cash on Delivery</button></form></div><aside class="summary-box"><h3 style="margin-top:0">Order summary</h3>${SX_CART.map(x=>`<div class="summary-line"><span>${esc(x.title)} × ${x.qty}</span><b>${fmtMoney(x.price*x.qty)}</b></div>`).join('')}<div class="summary-line"><span>Delivery charges</span><b>${fmtMoney(sxDeliveryCharge())}</b></div><div class="summary-line summary-total"><span>Total</span><b>${fmtMoney(sxCartTotal())}</b></div><p style="font-size:11px;color:var(--ink-soft)">Payment method: Cash on Delivery<br>Courier: TCS</p></aside></div></div></div>`}
function sxOrderTrack(order){const status=order.status||'pending';return `<div class="customer-card" style="max-width:none"><div class="order-meta"><div><b>${esc(order.order_number)}</b><div style="font-size:12px;color:var(--ink-soft)">${new Date(order.created_at).toLocaleString()}</div></div><span class="status-badge ${status}">${esc(SX_STATUS_LABEL[status]||status)}</span></div>${sxStatusTrack(status)}<div class="secure-note">${esc(order.tracking_note||'Your order status will appear here as it changes.')}${order.tracking_number?`<br><b>Tracking:</b> ${esc(order.tracking_number)}`:''}</div><h3>Items</h3>${(order.sx_order_items||[]).map(i=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0;font-size:13px"><span>${esc(i.title)} × ${i.quantity}</span><b>${fmtMoney(i.unit_price*i.quantity)}</b></div>`).join('')}<div class="summary-line summary-total"><span>Total</span><b>${fmtMoney(order.total)}</b></div><p style="font-size:12px;color:var(--ink-soft)">Delivery to ${esc(order.city)}, ${esc(order.province)}<br>${esc(order.address_line)}</p>${['pending','confirmed'].includes(status)?`<form onsubmit="event.preventDefault();sxCancelOrder('${order.id}',this)" style="margin-top:14px"><label style="font-size:12px;font-weight:700">Cancel order</label><select name="reason" required onchange="this.form.querySelector('[name=custom]').style.display=this.value==='custom'?'block':'none'"><option value="">Choose a reason</option>${SX_CANCEL_REASONS.map(r=>`<option>${esc(r)}</option>`).join('')}<option value="custom">Custom reason</option></select><textarea name="custom" placeholder="Custom reason" style="display:none;margin-top:8px"></textarea><button class="btn small danger" style="margin-top:8px">Cancel order</button></form>`:''}</div>`}
async function sxRenderOrders(singleId){if(!sxRequireLogin('/orders'))return '';if(!SX_ORDER_CACHE.length)await sxLoadOrders();let orders=SX_ORDER_CACHE;if(singleId)orders=orders.filter(o=>o.id===singleId||o.order_number===singleId);return `<div class="customer-shell"><div class="customer-card" style="max-width:900px"><div class="customer-head"><div><h1>${singleId?'Order details':'Order history'}</h1></div><button class="x-close" onclick="location.hash='/'">&times;</button></div>${orders.length?`<div class="order-list">${orders.map(o=>sxOrderTrack(o)).join('')}</div>`:`<div class="empty-state"><h3>No orders yet</h3><a href="#/category/all" class="btn small">Start shopping</a></div>`}</div></div>`}
function sxRenderPublicTrack(id){return `<div class="customer-shell"><div class="customer-card narrow"><div class="customer-head"><div><h1>Track order</h1><p style="color:var(--ink-soft)">${esc(id)}</p></div><button class="x-close" onclick="location.hash='/'">&times;</button></div><div id="public-track-box"><p>Loading order status…</p></div></div></div>`}
async function sxLoadPublicTrack(id){try{const {data,error}=await supabaseClient.rpc('sx_track_order',{p_order_number:id});if(error)throw error;const box=document.getElementById('public-track-box');if(!box)return;if(!data){box.innerHTML='<p>Order not found.</p>';return}const order=Array.isArray(data)?data[0]:data;box.innerHTML=`<div class="order-meta"><div><b>${esc(order.order_number)}</b><div style="font-size:12px;color:var(--ink-soft)">${new Date(order.created_at).toLocaleString()}</div></div><span class="status-badge ${esc(order.status)}">${esc(SX_STATUS_LABEL[order.status]||order.status)}</span></div>${sxStatusTrack(order.status)}<div class="secure-note">${esc(order.tracking_note||'Your order status will appear here as it changes.')}${order.tracking_number?`<br><b>Tracking:</b> ${esc(order.tracking_number)}`:''}</div><div style="margin-top:14px;font-weight:800">Total: ${fmtMoney(order.total)}</div>`;}catch(e){const b=document.getElementById('public-track-box');if(b)b.innerHTML='<p>Unable to load tracking right now.</p>'}}
function sxRenderOrderPrint(order){const base=location.origin&&location.origin!=='null'?location.origin:location.href.split('#')[0];const track=base+'#/track/'+encodeURIComponent(order.order_number);return `<div class="order-detail-print" id="print-order-sheet"><div class="print-brand"><div><div style="font-size:26px;font-weight:900">${esc(SETTINGS.siteName)}</div><div style="font-size:12px;color:#666">COD delivery order</div><div style="margin-top:10px"><span class="tcs-mark">TCS</span> <span style="font-size:12px;color:#666">Courier</span></div></div><div><div id="order-qr" class="qr-box"></div><div style="font-size:9px;text-align:center;width:120px">Scan to track order</div></div></div><h2>Order ${esc(order.order_number)}</h2><div class="admin-order-grid"><div><b>Receiver</b><p>${esc(order.receiver_name)}<br>${esc(order.phone)}<br>${esc(order.email)}</p><b>Delivery address</b><p>${esc(order.address_line)}<br>${esc(order.city)}, ${esc(order.province)} ${esc(order.postal_code||'')}</p></div><div><b>Order</b><p>${esc(SX_STATUS_LABEL[order.status]||order.status)}<br>Payment: Cash on Delivery<br>Courier: TCS<br>Tracking: ${esc(order.tracking_number||'—')}</p><b>Shipment information</b><p>Weight / dimensions and handling flags are shown to the courier/admin only.</p></div></div><h3>Items</h3>${(order.sx_order_items||[]).map(i=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:8px 0"><span>${esc(i.title)} × ${i.quantity}<small style="display:block;color:#666">SKU: ${esc(i.sku||'')} · Weight: ${esc(i.weight||'')} · Dimensions: ${esc(i.dimensions||'')} · ${i.is_fragile?'Fragile · ':''}${i.is_liquid?'Liquid · ':''}${i.is_flammable?'Flammable':''}</small></span><b>${fmtMoney(i.unit_price*i.quantity)}</b></div>`).join('')}<div style="margin-top:14px;text-align:right;font-size:18px;font-weight:900">Total: ${fmtMoney(order.total)}</div></div><script>window.__PRINT_TRACK=${JSON.stringify(track)};<\/script>`}
async function sxOpenOrderDetails(id){try{const {data,error}=await supabaseClient.from('sx_orders').select('*,sx_order_items(*)').eq('id',id).single();if(error)throw error;showModal(`<div class="customer-head"><h2>Order details</h2><button class="x-close" onclick="closeModal()">&times;</button></div><div class="field"><label>Paper / label size</label><select id="sx-print-size" onchange="const c=this.value==='custom';document.getElementById('sx-custom-size').style.display=c?'grid':'none'"><option value="5x7">5 × 7 in</option><option value="5x8">5 × 8 in</option><option value="6x9" selected>6 × 9 in</option><option value="7x9">7 × 9 in</option><option value="custom">Custom size</option></select></div><div id="sx-custom-size" class="form-grid-2" style="display:none;margin-bottom:12px"><div class="field"><label>Width (inches)</label><input id="sx-print-w" type="number" min="1" step="0.1" value="6"></div><div class="field"><label>Height (inches)</label><input id="sx-print-h" type="number" min="1" step="0.1" value="9"></div></div><div id="admin-print-content">${sxRenderOrderPrint(data)}</div><div class="modal-close-row"><button class="btn ghost" onclick="sxSaveOrderImage('${id}')">Save as image</button><button class="btn" onclick="sxPrintOrder('${id}')">Save / print PDF</button><button class="btn ghost" onclick="closeModal()">Close</button></div>`);setTimeout(()=>{const qr=document.getElementById('order-qr');if(window.QRCode&&qr)new QRCode(qr,{text:window.__PRINT_TRACK,width:120,height:120});},250)}catch(e){toast('Could not open order details: '+e.message)}}
function sxPrintDimensions(){const sel=document.getElementById('sx-print-size')?.value||'6x9';if(sel==='custom')return {w:Number(document.getElementById('sx-print-w')?.value)||6,h:Number(document.getElementById('sx-print-h')?.value)||9};const [w,h]=sel.split('x').map(Number);return {w,h}}
async function sxSaveOrderImage(id){const node=document.getElementById('print-order-sheet');if(!node||!window.html2canvas){toast('Image export library is not loaded yet');return}try{const d=sxPrintDimensions();const scale=2;const c=await html2canvas(node,{scale,backgroundColor:'#fff',width:Math.round(d.w*96),height:Math.round(d.h*96)});const a=document.createElement('a');a.download='StoreX-'+id+'-'+d.w+'x'+d.h+'.png';a.href=c.toDataURL('image/png');a.click()}catch(e){toast('Could not save image: '+e.message)}}
async function sxPrintOrder(id){const node=document.getElementById('print-order-sheet');if(!node)return;const d=sxPrintDimensions();const w=window.open('','_blank','noopener');if(!w){toast('Please allow popups to print the order');return}w.document.write('<html><head><title>Store.X Order</title><style>@page{size:'+d.w+'in '+d.h+'in;margin:.2in}body{font-family:Arial,sans-serif;margin:0;padding:0;color:#111}.order-detail-print{padding:18px;box-sizing:border-box;width:100%}</style></head><body>'+node.outerHTML+'</body></html>');w.document.close();setTimeout(()=>w.print(),400)}
function sxProductCard(p){const stock=Number(p.stock??0);const img=sxImage(p);return `<article class="card"><a href="#/product/${esc(p.seo&&p.seo.slug||p.id)}" class="card-img">${img?`<img src="${esc(img)}" alt="${esc(p.title)}" loading="lazy" decoding="async">`:''}</a>${p.badge?`<span class="card-badge">${esc(p.badge)}</span>`:''}<div class="card-body"><a href="#/product/${esc(p.seo&&p.seo.slug||p.id)}" class="card-title">${esc(p.shortTitle||p.title)}</a><div class="price">${fmtMoney(p.price)} ${p.oldPrice?`<span class="price-old">${fmtMoney(p.oldPrice)}</span>`:''}</div><div style="font-size:11px;color:${stock>0?'#1a7f37':'#b42318'};font-weight:700">${stock>0?stock+' in stock':'Out of stock'}</div><button class="card-cta" ${stock<=0?'disabled':''} onclick="event.preventDefault();sxAddToCart('${p.id}',1)">${stock>0?'Add to cart':'Out of stock'}</button></div></article>`}
function sxPatchProductForm(){
  const oldOpen=openProductModal; window.__sxOriginalOpenProductModal=oldOpen;
  openProductModal=function(id){
    const p=id?PRODUCTS.find(x=>x.id===id):{id:uid(),title:'',shortTitle:'',shortDesc:'',fullDesc:'',images:[],mainImage:null,category:'',tags:[],price:'',oldPrice:'',discount:'',badge:'',sku:'',status:'published',featured:false,trending:false,newArrival:false,bestSeller:false,order:PRODUCTS.length,stock:0,deliveryCharge:SX_DELIVERY_DEFAULT,delivery:{weight:'',dimensions:'',fragile:false,liquid:false,flammable:false},seo:{slug:'',title:'',description:'',keywords:''},clicks:0,views:0};

name="liquid" ${p.delivery.liquid?'checked':''}> Liquid</label><label class="checkline"><input type="checkbox" name="flammable" ${p.delivery.flammable?'checked':''}> Flammable</label></div><div class="field-hint">These details are kept for admin/courier paperwork and are not shown on the public product page.</div></div><div class="field full"><label>Product images</label><div class="upload-box"><label class="btn small">Upload from gallery<input type="file" accept="image/*" style="display:none" onchange="handleLocalFileInput(this,url=>{const p=window.__sxEditingProduct;p.images=p.images||[];p.images.push(url);p.mainImage=p.mainImage||url;document.getElementById('sx-img-list').innerHTML=p.images.map(im=>'<div class=\"t\"><img src=\"'+mediaSrc(im)+'\"></div>').join('')})"></label><button type="button" class="btn small ghost" onclick="openMediaPicker(url=>{const p=window.__sxEditingProduct;p.images=p.images||[];p.images.push(url);p.mainImage=p.mainImage||url;document.getElementById('sx-img-list').innerHTML=p.images.map(im=>'<div class=\"t\"><img src=\"'+mediaSrc(im)+'\"></div>').join('')})">Choose from Media</button><div id="sx-img-list" class="thumb-picker">${(p.images||[]).map(im=>`<div class="t"><img src="${mediaSrc(im)}"></div>`).join('')}</div></div></div></div><div class="modal-close-row"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn">Save Product</button></div></form>`);
    if(isNew)window.__draftProduct=p; else window.__draftProduct=null;

async function sxSaveProductForm(pid,isNew){const form=document.getElementById('product-form');const fd=new FormData(form);const draft=isNew?window.__draftProduct:PRODUCTS.find(x=>x.id===pid);if(!draft)return;Object.assign(draft,{title:String(fd.get('title')||'').trim(),sku:String(fd.get('sku')||'').trim(),category:String(fd.get('category')||''),price:Number(fd.get('price'))||0,stock:Number(fd.get('stock'))||0,deliveryCharge:Number(fd.get('deliveryCharge'))||0,shortDesc:String(fd.get('shortDesc')||'').trim(),fullDesc:String(fd.get('fullDesc')||'').trim(),tags:String(fd.get('tags')||'').split(',').map(x=>x.trim()).filter(Boolean),status:String(fd.get('status')||'published'),delivery:{weight:String(fd.get('weight')||''),dimensions:String(fd.get('dimensions')||''),fragile:fd.get('fragile')==='on',liquid:fd.get('liquid')==='on',flammable:fd.get('flammable')==='on'}});draft.shortTitle=draft.shortTitle||draft.title;draft.seo=draft.seo||{slug:slugify(draft.title),title:'',keywords:'',description:''};if(isNew){PRODUCTS.push(draft);window.__draftProduct=null}await saveKey(KEYS.products,PRODUCTS);closeModal();toast('Product saved to Supabase ✓');render()}

function sxPatchProductPage(){window.renderProductPage=function(key){const p=PRODUCTS.find(x=>(x.seo&&x.seo.slug)===key||x.id===key);if(!p||p.status!=='published')return renderNotFound('Product not found','This product may have been removed or is no longer available.');const stock=Number(p.stock??0),images=p.images&&p.images.length?p.images:(p.mainImage?[p.mainImage]:[]),main=images[PD_ACTIVE_IMG]||images[0],cat=CATEGORIES.find(c=>c.id===p.category);return `<div class="container" style="padding:30px 20px"><div class="crumb"><a href="#/">Home</a> / ${cat?`<a href="#/category/${esc(cat.slug)}">${esc(cat.name)}</a> / `:''}${esc(p.title)}</div><div class="pd-grid"><div><div class="pd-main-img">${main?`<img src="${mediaSrc(main)}" alt="${esc(p.title)}" loading="eager">`:''}</div>${images.length>1?`<div class="pd-thumbs">${images.map((im,i)=>`<img src="${mediaSrc(im)}" class="${i===PD_ACTIVE_IMG?'active':''}" loading="lazy" onclick="PD_ACTIVE_IMG=${i};render()">`).join('')}</div>`:''}</div><div><h1 class="pd-title">${esc(p.title)}</h1>${p.badge?`<span class="discount-pill">${esc(p.badge)}</span>`:''}<div class="pd-price">${fmtMoney(p.price)} ${p.oldPrice?`<span class="price-old">${fmtMoney(p.oldPrice)}</span>`:''}</div><div class="pd-desc">${esc(p.fullDesc||p.shortDesc||'')}</div>${p.tags?.length?`<div class="pd-tags">${p.tags.map(t=>`<span class="tag-pill">${esc(t)}</span>`).join('')}</div>`:''}<div style="margin:12px 0;font-size:13px;font-weight:800;color:${stock>0?'#1a7f37':'#b42318'}">${stock>0?stock+' in stock':'Out of stock'}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" style="flex:1" ${stock<=0?'disabled':''} onclick="sxAddToCart('${p.id}',1)">Add to cart</button><button class="btn" style="flex:1" ${stock<=0?'disabled':''} onclick="if(sxRequireLogin('/checkout')){sxAddToCart('${p.id}',1);location.hash='/checkout'}">Buy Now</button></div><div class="secure-note" style="margin-top:14px">Cash on Delivery · Delivered by TCS · You will be contacted on your phone/WhatsApp to confirm the order.</div></div></div></div>`}}

function sxPatchRouter(){const oldRender=render;window.render=async function(){const h=route();if(h.startsWith('/admin-of-storex')){document.getElementById('app').innerHTML=renderAdminRoot();wireAdminEvents();return}if(h==='/login'||h.startsWith('/login?')){document.getElementById('app').innerHTML=renderHeader()+'<main>'+sxRenderAuthPage('login')+'</main>'+renderFooter();return}if(h==='/signup'||h.startsWith('/signup?')){document.getElementById('app').innerHTML=renderHeader()+'<main>'+sxRenderAuthPage('signup')+'</main>'+renderFooter();return}if(h==='/settings'){await sxLoadCustomer();document.getElementById('app').innerHTML=renderHeader()+'<main>'+sxRenderSettings()+'</main>'+renderFooter();return}if(h==='/cart'){document.getElementById('app').innerHTML=renderHeader()+'<main>'+sxRenderCart()+'</main>'+renderFooter();return}if(h==='/checkout'){await sxLoadCustomer();document.getElementById('app').innerHTML=renderHeader()+'<main>'+sxRenderCheckout()+'</main>'+renderFooter();return}if(h==='/orders'||h.startsWith('/orders/')){await sxLoadCustomer();const id=h.split('/orders/')[1];document.getElementById('app').innerHTML=renderHeader()+'<main>'+await sxRenderOrders(id)+'</main>'+renderFooter();return}if(h.startsWith('/track/')){const id=decodeURIComponent(h.split('/track/')[1]);document.getElementById('app').innerHTML=renderHeader()+'<main>'+sxRenderPublicTrack(id)+'</main>'+renderFooter();setTimeout(()=>sxLoadPublicTrack(id),30);return}return oldRender()}}
async function sxBootCustomer(){if(!supabaseClient)return;await sxLoadCustomer();supabaseClient.auth.onAuthStateChange(async()=>{await sxLoadCustomer();if(!route().startsWith('/admin-of-storex'))render()});}
function sxInitUpgrade(){sxPatchHeader();sxPatchDrawer();sxPatchFooter();sxPatchProductPage();sxPatchProductCard();sxPatchProductForm();sxPatchAdminProductStats();sxPatchAdminSidebar();sxPatchAdmin();sxPatchRouter();}

    'Islamabad Capital Territory':['Islamabad']
  };
  const famousSet={};
  Object.keys(SX2_FAMOUS).forEach(k=>{famousSet[k]=new Set(SX2_FAMOUS[k].slice(0,12).map(x=>x.toLowerCase()));});

  // Keep existing province lists but replace them with a larger, de-duplicated city directory.
  Object.keys(SX2_FAMOUS).forEach(prov=>{
    const old=Array.isArray(window.SX_PROVINCES?.[prov])?window.SX_PROVINCES[prov]:[];
    const merged=[...SX2_FAMOUS[prov],...old];
    window.SX_PROVINCES[prov]=[...new Set(merged.filter(Boolean))].sort((a,b)=>{
      const af=famousSet[prov]?.has(a.toLowerCase())?0:1, bf=famousSet[prov]?.has(b.toLowerCase())?0:1;
      return af-bf || a.localeCompare(b);
    });
  });

  function cityPickerHtml2(province,selected,name='city'){
    const id='sx-city-picker-'+uid();
    return `<div class="sx-city-picker" data-province="${esc(province||'')}" data-selected="${esc(selected||'')}" data-city-id="${id}">
      <input class="sx-city-input" name="${esc(name)}" id="${id}" value="${esc(selected||'')}" placeholder="Search or select your city" autocomplete="off" required
        onfocus="sxOpenCityPicker(this)" oninput="sxFilterCityPicker(this)">
      <div class="sx-city-menu" id="${id}-menu" role="listbox"></div>
    </div>`;
  }
  function cityItems(province,q){
    const list=window.SX_PROVINCES?.[province]||[]; const query=(q||'').trim().toLowerCase();

    const rest=list.filter(c=>!famousSet[province]?.has(c.toLowerCase()));

    return ordered.filter(c=>!query || c.toLowerCase().includes(query)).slice(0,80);
  }

    return `<header id="site-header"><div class="container header-row">
      <button class="mobile-toggle" type="button" onclick="MOBILE_DRAWER_OPEN=true;render()" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="logo-wrap"><a href="#/">${logo}</a></div>
      <div class="search-wrap"><form class="search-form" onsubmit="event.preventDefault();performSearchQuery(this.q.value)" autocomplete="off">
        <input name="q" type="search" placeholder="Search products..." aria-label="Search products" onfocus="openSearchSuggestions(this)" oninput="openSearchSuggestions(this)" onclick="openSearchSuggestions(this)">
        <button type="submit" aria-label="Search">⌕</button><div class="search-suggestions" role="listbox"></div>

      <button class="mobile-search-toggle" type="button" onclick="MOBILE_SEARCH_OPEN=!MOBILE_SEARCH_OPEN;render()" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
    </div></header>`;
  };

  window.openSearchSuggestions=function(input){
    const box=input?.closest('.search-wrap')?.querySelector('.search-suggestions'); if(!box)return;

      (vals.length?vals.map(v=>`<button type="button" class="search-suggestion" role="option" data-search-value="${esc(v)}" onclick="performSearchQuery(this.getAttribute('data-search-value'))"><span>${q?'':'↗ '}${esc(v)}</span><small>${q?'Search':'Trending'}</small></button>`).join(''):'<div style="padding:12px;color:var(--ink-soft);font-size:12px">No suggestions yet. Try a product name.</div>');
    box.classList.add('open');
  };

  // Native lazy loading only: no IntersectionObserver for CSS background images.
  // Convert legacy lazy background nodes to real lazy <img> nodes after each render.
  window.initLazyMedia=function(){
    document.querySelectorAll('[data-lazy-bg]').forEach(el=>{
      const url=el.getAttribute('data-lazy-bg'); if(!url)return;
      const img=document.createElement('img'); img.src=url; img.loading='lazy'; img.decoding='async'; img.alt=''; img.style.cssText='width:100%;height:100%;object-fit:cover;display:block;';
      el.innerHTML=''; el.style.backgroundImage='none'; el.appendChild(img); el.removeAttribute('data-lazy-bg');
    });
    document.querySelectorAll('img:not([loading])').forEach(img=>{if(!img.closest('.pd-main-img'))img.loading='lazy';});
  };

  // Hide old Daraz-only promotional section from the retail storefront.
  const oldRenderSection=window.renderSection;
  window.renderSection=function(sec){if(sec?.type==='darazPromo')return '';return oldRenderSection(sec)};
  window.renderDarazPromoSection=function(){return ''};

  // Ensure demo products have useful inventory numbers for testing.
  function ensureDemoStock(){
    let changed=false;
    (window.PRODUCTS||[]).forEach(p=>{
      if(/^DEMO-/.test(String(p.sku||'')) || String(p.id||'').startsWith('p-')){
        if(p.stock==null){p.stock=20;changed=true;}
        if(p.deliveryCharge==null)p.deliveryCharge=250;
        if(!p.delivery)p.delivery={weight:'0.5 kg',dimensions:'20 × 15 × 8 cm',fragile:false,liquid:false,flammable:false};
      }
    });
    if(changed && typeof render==='function')setTimeout(()=>render(),50);
  }
  setTimeout(ensureDemoStock,900);

  // Make drawer actions reliable and include account/order links.
  window.renderMobileDrawer=function(){
    if(!MOBILE_DRAWER_OPEN)return '';
    const cats=(CATEGORIES||[]).filter(c=>c.status!=='hidden').sort((a,b)=>(a.order||0)-(b.order||0));
    return `<div class="mobile-drawer open" onclick="if(event.target===this){MOBILE_DRAWER_OPEN=false;render()}"><div class="mobile-drawer-panel">
      <button class="mobile-drawer-close" type="button" onclick="MOBILE_DRAWER_OPEN=false;render()">&times;</button>
      <a href="#/" onclick="MOBILE_DRAWER_OPEN=false">Home</a>
      <a href="#/category/all" onclick="MOBILE_DRAWER_OPEN=false">All Products</a>
      <a href="#/orders" onclick="MOBILE_DRAWER_OPEN=false">Order History</a>
      <a href="${SX_CUSTOMER?'#/settings':'#/login'}" onclick="MOBILE_DRAWER_OPEN=false">${SX_CUSTOMER?'Account Settings':'Login / Sign up'}</a>
      <a href="#/cart" onclick="MOBILE_DRAWER_OPEN=false">Cart (${sxCartCount()})</a>
      <details class="mobile-category-group"><summary>All Categories <span>⌄</span></summary><div>${cats.map(c=>`<a href="#/category/${esc(c.slug)}" onclick="MOBILE_DRAWER_OPEN=false">${esc(c.name)}</a>`).join('')}</div></details>
    </div></div>`;
  };

  // Reapply the retail header/drawer after the earlier upgrade patches run.
  sxPatchHeader();
  sxPatchDrawer();
})();

</script>
<script>
/* Store.X FINAL INTERACTION FIX v4 */
(function(){

  window.performSearchQuery=function(v){const q=String(v||'').trim();if(!q)return false;document.querySelectorAll('.search-form input[name="q"]').forEach(i=>i.value=q);document.querySelectorAll('.search-suggestions').forEach(b=>b.classList.remove('open'));MOBILE_SEARCH_OPEN=false;location.hash='/search?q='+encodeURIComponent(q);return false;};

    const sug=e.target.closest?.('.search-suggestion[data-search-value]');
    if(sug){e.preventDefault();e.stopPropagation();window.performSearchQuery(sug.getAttribute('data-search-value')||'');return;}
    const ms=e.target.closest?.('.mobile-search-toggle');
    if(ms){e.preventDefault();e.stopPropagation();MOBILE_SEARCH_OPEN=!MOBILE_SEARCH_OPEN;render();setTimeout(()=>{const i=document.querySelector('.search-form input[name="q"]');if(MOBILE_SEARCH_OPEN&&i){i.focus();openSearchSuggestions(i);}},30);}
  },true);
  document.addEventListener('submit',function(e){const f=e.target.closest?.('.search-form');if(!f)return;e.preventDefault();window.performSearchQuery(f.querySelector('input[name="q"]')?.value||'');},true);

  // Header: mobile search gets the mobile-open class so it is actually visible.
  window.renderHeader=function(){
    const logo=SETTINGS.logo?`<img src="${mediaSrc(SETTINGS.logo)}" alt="${esc(SETTINGS.siteName)} logo" style="width:${SETTINGS.logoWidth}px;height:auto;max-height:56px">`:`<span class="logo-fallback">${esc(SETTINGS.siteName)}</span>`;
    const q=String(new URLSearchParams((route().split('?')[1]||'')).get('q')||'');
    return `<header id="site-header"><div class="container header-row"><button class="mobile-toggle" type="button" onclick="MOBILE_DRAWER_OPEN=true;render()" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button><div class="logo-wrap"><a href="#/">${logo}</a></div><div class="search-wrap"><form class="search-form ${MOBILE_SEARCH_OPEN?'mobile-open':''}" autocomplete="off"><input name="q" type="search" placeholder="Search products..." value="${esc(q)}" onfocus="openSearchSuggestions(this)" oninput="openSearchSuggestions(this)"><button type="submit" aria-label="Search">⌕</button><div class="search-suggestions"></div></form></div><nav class="main-nav"><a class="auth-link" href="${SX_CUSTOMER?'#/settings':'#/login'}">${SX_CUSTOMER?'Account':'Login / Sign up'}</a><a class="cart-link" href="#/cart">Cart <span class="cart-count">${sxCartCount()}</span></a></nav><button class="mobile-search-toggle" type="button" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button></div></header>`;
  };

  // Drawer must be present on login, signup, settings, cart and orders too.
  window.renderMobileDrawer=function(){
    if(!MOBILE_DRAWER_OPEN)return '';
    const cats=(CATEGORIES||[]).filter(c=>c.status!=='hidden').sort((a,b)=>(a.order||0)-(b.order||0));
    return `<div class="mobile-drawer open" role="dialog" aria-label="Menu" onclick="if(event.target===this){MOBILE_DRAWER_OPEN=false;render()}"><div class="mobile-drawer-panel"><button class="mobile-drawer-close" type="button" onclick="MOBILE_DRAWER_OPEN=false;render()" aria-label="Close menu">&times;</button><div style="clear:both;height:8px"></div><a href="#/" onclick="MOBILE_DRAWER_OPEN=false">Home</a><a href="#/category/all" onclick="MOBILE_DRAWER_OPEN=false">All Products</a><a href="#/cart" onclick="MOBILE_DRAWER_OPEN=false">Cart (${sxCartCount()})</a><a href="${SX_CUSTOMER?'#/settings':'#/login'}" onclick="MOBILE_DRAWER_OPEN=false">${SX_CUSTOMER?'Account Settings':'Login / Sign up'}</a><a href="#/orders" onclick="MOBILE_DRAWER_OPEN=false">Order History</a><details class="mobile-category-group"><summary>All Categories <span>⌄</span></summary><div>${cats.map(c=>`<a href="#/category/${esc(c.slug)}" onclick="MOBILE_DRAWER_OPEN=false">${esc(c.name)}</a>`).join('')}</div></details></div></div>`;

  // City is free text. No hard-coded city territory/list is required.

  window.cityPickerHtml2=window.sxCityPickerHtml;
  window.sxRenderAuthPage=function(mode){
    const signup=mode==='signup';
    return `<div class="customer-shell"><div class="customer-card narrow"><div class="customer-head"><div><div class="logo-fallback">${esc(SETTINGS.siteName)}</div><h1 style="margin-top:8px">${signup?'Create your account':'Welcome back'}</h1></div><button class="x-close" onclick="location.hash='/'" aria-label="Close">&times;</button></div><div class="auth-tabs"><a class="${!signup?'active':''}" href="#/login">Login</a><a class="${signup?'active':''}" href="#/signup">Sign up</a></div>${signup?`<form onsubmit="event.preventDefault();sxSignUp(this)"><div class="form-grid-2"><div class="field full"><label>Full name</label><input name="name" autocomplete="name" required></div><div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" required></div><div class="field"><label>Phone number</label><input name="phone" type="tel" placeholder="03XXXXXXXXX" autocomplete="tel" required></div><div class="field full"><label>Password</label><input name="password" type="password" minlength="6" autocomplete="new-password" required></div><div class="field full"><label>Province / Territory</label><select name="province" required><option value="">Select province / territory</option>${Object.keys(SX_PROVINCES).map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('')}</select></div><div class="field full"><label>City</label><input name="city" placeholder="Enter your city" autocomplete="address-level2" required></div><div class="field full"><label>Full delivery address</label><textarea name="address" required placeholder="House/flat, street, area, landmark"></textarea></div><div class="field"><label>Postal code</label><input name="postal_code" autocomplete="postal-code"></div></div><div class="secure-note">Pakistan delivery only. Your phone number will be used to confirm your Cash on Delivery order.</div><button class="btn" style="width:100%;justify-content:center;margin-top:14px">Create account</button></form>`:`<form onsubmit="event.preventDefault();sxLogin(this)"><div class="field"><label>Email</label><input name="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div><button class="btn" style="width:100%;justify-content:center;margin-top:14px">Login</button></form>`}</div></div>`;
