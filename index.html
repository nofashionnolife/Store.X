<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store.X — Shop the Deals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#F57224;
  --primary-dark:#D9631B;
  --ink:#1F2328;
  --ink-soft:#5B616B;
  --paper:#FAF9F7;
  --line:#E5E2DC;
  --card:#FFFFFF;
  --radius:8px;
  --header-bg:#FFFFFF;
  --header-text:#1F2328;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  color:var(--ink);
  background:var(--paper);
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Space Grotesk',system-ui,sans-serif;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
img{max-width:100%;display:block;}
.container{max-width:1240px;margin:0 auto;padding:0 20px;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}

/* ---------- Header ---------- */
#site-header{background:var(--header-bg);color:var(--header-text);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;}
.header-row{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;padding:14px 0;}
.logo-wrap{display:flex;align-items:center;gap:10px;min-width:0;}
.logo-wrap img{object-fit:contain;}
.logo-fallback{font-family:'Space Grotesk';font-weight:700;font-size:22px;white-space:nowrap;}
.logo-fallback .x{color:var(--primary);}
.search-form{display:flex;max-width:560px;margin:0 auto;width:100%;}
.search-form input{flex:1;border:1.5px solid var(--line);border-right:none;border-radius:6px 0 0 6px;padding:10px 14px;font-size:14px;background:var(--card);color:var(--ink);}
.search-form input:focus{outline:none;border-color:var(--primary);}
.search-form button{background:var(--primary);border:none;color:#fff;padding:0 18px;border-radius:0 6px 6px 0;font-weight:600;font-size:14px;}
.search-form button:hover{background:var(--primary-dark);}
.main-nav{display:flex;gap:22px;align-items:center;white-space:nowrap;}
.main-nav a{font-size:14px;font-weight:600;padding:6px 2px;border-bottom:2px solid transparent;}
.main-nav a:hover{border-color:var(--primary);}
.mobile-toggle,.mobile-search-toggle{display:none;background:none;border:none;padding:8px;color:var(--header-text);}
.mobile-toggle svg,.mobile-search-toggle svg{width:24px;height:24px;}
.mobile-drawer{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;}
.mobile-drawer.open{display:block;}
.mobile-drawer-panel{background:#fff;width:82%;max-width:320px;height:100%;padding:22px 18px;overflow-y:auto;}
.mobile-drawer-panel a{display:block;padding:12px 4px;font-weight:600;border-bottom:1px solid var(--line);}
.mobile-drawer-close{float:right;background:none;border:none;font-size:22px;color:var(--ink-soft);}
@media (max-width:820px){
  .main-nav{display:none;}
  .mobile-toggle{display:inline-flex;order:1;justify-self:start;}
  .header-row{grid-template-columns:auto auto 1fr;padding:10px 0;}
  .logo-wrap{order:2;padding-left:4px;}
  .search-form{display:none;order:4;grid-column:1/-1;margin-top:8px;max-width:none;}
  .search-form.mobile-open{display:flex;}
  .mobile-search-toggle{display:inline-flex;order:3;justify-self:end;}
}

/* ---------- Hero ---------- */
.hero{position:relative;background:linear-gradient(135deg,#1F2328,#3A3F47);color:#fff;overflow:hidden;}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;}
.hero-bg-slide{position:absolute;inset:0;opacity:0;transition:opacity 1s ease;}
.hero-bg-slide.active{opacity:1;}
.hero-bg-desktop,.hero-bg-mobile{position:absolute;inset:0;background-size:cover;background-position:center;}
.hero-bg-mobile{display:none;}
@media (max-width:720px){.hero-bg-desktop{display:none;} .hero-bg-mobile{display:block;}}
.hero-overlay{position:absolute;inset:0;background:rgba(10,10,12,var(--hero-overlay,0.35));}
.hero-inner{position:relative;padding:64px 20px;max-width:1240px;margin:0 auto;min-height:220px;display:flex;flex-direction:column;justify-content:center;}
.hero-inner.align-center{align-items:center;text-align:center;}
.hero-inner.align-left{align-items:flex-start;text-align:left;}
.hero h1{font-size:clamp(28px,5vw,46px);margin:0 0 12px;max-width:640px;font-weight:700;}
.hero p{font-size:17px;color:rgba(255,255,255,.85);max-width:520px;margin:0 0 22px;}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:#fff;border:none;padding:12px 22px;border-radius:6px;font-weight:600;font-size:14.5px;transition:background .15s;}
.btn:hover{background:var(--primary-dark);}
.btn.secondary{background:transparent;border:1.5px solid currentColor;}
.btn.small{padding:8px 14px;font-size:13px;}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--line);}
.btn.danger{background:#B3261E;color:#fff;}
.btn.danger:hover{background:#8f1e18;}

/* ---------- Sections ---------- */
.section{padding:44px 0;}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:14px;flex-wrap:wrap;}
.section-head h2{font-size:24px;margin:0 0 4px;font-weight:700;}
.section-head p{margin:0;color:var(--ink-soft);font-size:14.5px;}
.section-head a{font-size:13.5px;font-weight:600;color:var(--primary);}

/* ---------- Product Grid / Card ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:720px){.grid{grid-template-columns:repeat(3,1fr);gap:8px;} .grid.cols-2{grid-template-columns:repeat(2,1fr);} .grid.cols-4{grid-template-columns:repeat(3,1fr);}}
@media (max-width:480px){.grid.compact-fallback{grid-template-columns:repeat(2,1fr);gap:10px;} .grid.cols-4{grid-template-columns:repeat(2,1fr);}}
.spotlight-card{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.spotlight-card .spotlight-img{aspect-ratio:1/1;background:#F2F0EB;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.spotlight-card .spotlight-img img{width:100%;height:100%;object-fit:contain;}
.spotlight-card .spotlight-body{padding:26px 30px;display:flex;flex-direction:column;justify-content:center;gap:10px;}
.spotlight-card .spotlight-body h3{font-size:24px;margin:0;font-weight:700;}
.spotlight-card .spotlight-body .price{font-size:22px;}
@media (max-width:720px){.spotlight-card{grid-template-columns:1fr;} .spotlight-card .spotlight-body{padding:16px;}}
.cat-showcase-group{margin-bottom:34px;}
.cat-showcase-group:last-child{margin-bottom:0;}
.cat-showcase-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.cat-showcase-head h3{font-size:18px;margin:0;font-weight:700;}
.cat-showcase-head a{font-size:13px;font-weight:600;color:var(--primary);}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s,border-color .15s;position:relative;}
.card:hover{border-color:#D8D3C9;box-shadow:0 6px 18px rgba(20,20,20,.07);}
.card-img{aspect-ratio:1/1;background:#F2F0EB;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.card-img img{width:100%;height:100%;object-fit:contain;}
.card-badge{position:absolute;top:8px;left:8px;background:var(--primary);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px;z-index:2;}
.card-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px;flex:1;}
.card-title{font-size:13.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em;}
.card-desc{font-size:12px;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
.price-row{display:flex;align-items:baseline;gap:7px;margin-top:2px;}
.price{font-size:16px;font-weight:700;color:var(--ink);}
.price-old{font-size:12px;color:var(--ink-soft);text-decoration:line-through;}
.discount-pill{font-size:11px;font-weight:700;color:#1a7f37;background:#E9F7EE;padding:2px 6px;border-radius:4px;}
.card-cta{margin-top:auto;width:100%;background:var(--primary);color:#fff;border:none;padding:9px;font-size:12.5px;font-weight:700;border-radius:6px;}
.card-cta:hover{background:var(--primary-dark);}
@media (max-width:480px){
  .card-title{font-size:11.5px;min-height:2.2em;}
  .price{font-size:13px;}
  .card-cta{font-size:11px;padding:7px;}
  .card-body{padding:7px 8px 8px;gap:3px;}
}

/* ---------- Categories (box grid) ---------- */
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.cat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:8px;transition:box-shadow .15s,border-color .15s;}
.cat-card:hover{border-color:var(--primary);box-shadow:0 6px 18px rgba(20,20,20,.07);}

/* Dynamic full width image container */
.cat-icon{width:100%;max-width:100%;height:130px;background:#F2F0EB;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:24px;border-radius:6px;margin:0 auto;}
.cat-icon img{width:100%;height:100%;object-fit:cover;display:block;}

.cat-name{font-size:13px;font-weight:600;text-align:center;padding:8px 2px 2px 2px;}

/* Mobile responsiveness */
@media (max-width:480px){
  .cat-grid{grid-template-columns:repeat(3,1fr);gap:8px;} 
  .cat-icon{max-width:100%;height:90px;} 
  .cat-name{font-size:11px;padding:5px 2px 0 2px;}
}

/* ---------- Flash sale ---------- */
.flash{background:var(--ink);color:#fff;border-radius:12px;overflow:hidden;position:relative;display:grid;grid-template-columns:1.1fr 1fr;min-height:200px;}
.flash-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.35;}
.flash-info{position:relative;padding:30px;display:flex;flex-direction:column;justify-content:center;gap:10px;}
.flash-eyebrow{color:var(--primary);font-weight:700;font-size:13px;}
.flash-info h3{font-size:26px;margin:0;font-weight:700;}
.flash-info p{margin:0;color:rgba(255,255,255,.75);font-size:14px;}
.countdown{display:flex;gap:8px;margin-top:6px;}
.countdown .chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:8px 10px;min-width:52px;text-align:center;}
.countdown .chip b{display:block;font-size:19px;font-family:'Space Grotesk';}
.countdown .chip span{font-size:10px;color:rgba(255,255,255,.65);text-transform:uppercase;}
.flash-visual{position:relative;background-size:cover;background-position:center;overflow:hidden;}
.flash-visual-slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .8s ease;}
.flash-visual-slide.active{opacity:1;}
@media (max-width:720px){.flash{grid-template-columns:1fr;} .flash-visual{min-height:140px;order:-1;}}
.flash-carousel{position:relative;overflow:hidden;border-radius:12px;}
.flash-track{display:flex;transition:transform .6s ease;}
.flash-slide{flex:0 0 100%;min-width:0;display:block;}
.flash-slide .flash{border-radius:12px;}
.flash-dots{display:flex;gap:6px;justify-content:center;margin-top:10px;}
.flash-dots button{width:8px;height:8px;border-radius:50%;background:var(--line);border:none;padding:0;}
.flash-dots button.active{background:var(--primary);width:20px;border-radius:5px;}

/* ---------- Banner ---------- */
.promo-banner{border-radius:12px;overflow:hidden;background:#F2F0EB;position:relative;min-height:160px;display:flex;align-items:center;background-size:cover;background-position:center;}
.promo-banner-inner{position:relative;padding:30px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.4);}
.promo-banner-inner h3{margin:0 0 6px;font-size:22px;}
.promo-banner-inner p{margin:0 0 14px;font-size:14px;}
.promo-banner-overlay{position:absolute;inset:0;background:rgba(0,0,0,.25);}

/* ---------- Footer ---------- */
#site-footer{background:#1F2328;color:#C9CBCE;margin-top:60px;}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:30px;padding:44px 0 24px;}
.footer-grid h4{color:#fff;font-size:14px;margin:0 0 12px;}
.footer-grid a{display:block;font-size:13.5px;padding:4px 0;color:#B7BABE;}
.footer-grid a:hover{color:#fff;}
.footer-bottom{border-top:1px solid #33373D;padding:16px 0;font-size:12.5px;color:#8A8D91;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.social-row{display:flex;gap:10px;margin-top:10px;}
.social-row a{width:32px;height:32px;border-radius:50%;background:#2C3036;display:flex;align-items:center;justify-content:center;font-size:13px;}
@media (max-width:720px){.footer-grid{grid-template-columns:1fr 1fr;}}

/* ---------- Empty / error states ---------- */
.empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);}
.empty-state .icon{font-size:40px;margin-bottom:10px;}
.empty-state h3{color:var(--ink);margin:0 0 6px;}

/* ---------- Breadcrumb ---------- */
.crumb{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;}
.crumb a:hover{color:var(--primary);}

/* ---------- Product detail ---------- */
.pd-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;}
@media (max-width:820px){.pd-grid{grid-template-columns:1fr;gap:20px;}}
.pd-main-img{background:#F2F0EB;border-radius:10px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.pd-main-img img{width:100%;height:100%;object-fit:contain;}
.pd-thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.pd-thumbs img{width:60px;height:60px;object-fit:cover;border-radius:6px;border:1.5px solid var(--line);cursor:pointer;}
.pd-thumbs img.active{border-color:var(--primary);}
.pd-title{font-size:26px;margin:0 0 8px;font-weight:700;}
.pd-tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;}
.tag-pill{font-size:11.5px;background:#F2F0EB;padding:3px 9px;border-radius:20px;color:var(--ink-soft);}
.pd-desc{color:var(--ink-soft);font-size:14.5px;margin:14px 0;white-space:pre-line;}
.pd-price{font-size:28px;font-weight:700;margin:10px 0 4px;}

/* ---------- Admin ---------- */
.admin-shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh;background:#F3F2EF;}
.admin-sidebar{background:#1F2328;color:#D4D6D9;padding:20px 14px;}
.admin-sidebar .brand{color:#fff;font-family:'Space Grotesk';font-weight:700;font-size:19px;margin-bottom:20px;padding:0 6px;}
.admin-sidebar .brand .x{color:var(--primary);}
.admin-sidebar a,.admin-sidebar button.navlink{display:block;width:100%;text-align:left;background:none;border:none;color:#B7BABE;padding:9px 10px;border-radius:6px;font-size:13.5px;font-weight:600;margin-bottom:2px;}
.admin-sidebar a:hover,.admin-sidebar button.navlink:hover{background:#2C3036;color:#fff;}
.admin-sidebar a.active,.admin-sidebar button.navlink.active{background:var(--primary);color:#fff;}
.admin-sidebar .group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#71757B;margin:16px 6px 6px;}
.admin-main{padding:26px 30px;overflow-x:auto;}
.admin-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
.admin-topbar h1{font-size:22px;margin:0;}
.admin-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:18px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px;}
.stat-box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;}
.stat-box b{font-size:26px;display:block;font-family:'Space Grotesk';}
.stat-box span{font-size:12.5px;color:var(--ink-soft);}
.admin-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.admin-table th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);color:var(--ink-soft);font-size:12px;text-transform:uppercase;letter-spacing:.03em;}
.admin-table td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
.admin-table img{width:40px;height:40px;object-fit:cover;border-radius:4px;}
.row-actions{display:flex;gap:6px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:700px){.form-grid{grid-template-columns:1fr;}}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:2px;}
.field.full{grid-column:1/-1;}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.field input[type=text],.field input[type=number],.field input[type=url],.field input[type=password],.field input[type=datetime-local],.field select,.field textarea{
  border:1.5px solid var(--line);border-radius:6px;padding:9px 10px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink);
}
.field textarea{resize:vertical;min-height:70px;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);}
.checkline{display:flex;align-items:center;gap:8px;font-size:13.5px;}
.badge-status{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;}
.badge-status.on{background:#E9F7EE;color:#1a7f37;}
.badge-status.off{background:#F1EFEA;color:#8A8D91;}
.modal-overlay{position:fixed;inset:0;background:rgba(20,20,20,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:100;}
.modal-box{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:640px;}
.modal-box h2{margin:0 0 16px;font-size:19px;}
.modal-close-row{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);}
.section-list-item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px;cursor:grab;}
.section-list-item.dragging{opacity:.4;}
.section-list-item .handle{color:var(--ink-soft);font-size:16px;}
.section-list-item .meta{flex:1;}
.section-list-item .meta b{font-size:13.5px;}
.section-list-item .meta div{font-size:11.5px;color:var(--ink-soft);}
.thumb-picker{display:flex;flex-wrap:wrap;gap:8px;}
.thumb-picker .t{width:64px;height:64px;border:2px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;}
.thumb-picker .t.sel{border-color:var(--primary);}
.thumb-picker .t img{width:100%;height:100%;object-fit:cover;}
.upload-box{border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;font-size:12.5px;color:var(--ink-soft);}
.upload-note{font-size:11.5px;color:var(--primary-dark);background:#FFF4EA;border:1px solid #F5D8B8;padding:6px 9px;border-radius:6px;margin-top:8px;text-align:left;}
.seo-fieldset{border:1px dashed var(--line);border-radius:8px;padding:14px;margin-top:6px;}
.seo-fieldset legend{font-size:12.5px;font-weight:700;color:var(--ink-soft);padding:0 6px;}
.login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1F2328;}
.login-card{background:#fff;border-radius:12px;padding:34px;width:100%;max-width:360px;}
.swatch{display:inline-block;width:16px;height:16px;border-radius:4px;border:1px solid var(--line);vertical-align:middle;margin-right:6px;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;font-size:13.5px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.25);}
.help-note{font-size:12px;color:var(--ink-soft);background:#FFF8EE;border:1px solid #F0DDBB;padding:8px 10px;border-radius:6px;margin-bottom:14px;}
.admin-hamburger{display:none;}
.admin-drawer-overlay{display:none;}
@media (max-width:900px){
  .admin-shell{grid-template-columns:1fr;}
  .admin-hamburger{display:inline-flex;align-items:center;justify-content:center;background:#1F2328;color:#fff;border:none;width:42px;height:42px;border-radius:8px;position:fixed;top:14px;left:14px;z-index:70;box-shadow:0 2px 12px rgba(0,0,0,.3);}
  .admin-hamburger svg{width:22px;height:22px;}
  .admin-drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55;}
  .admin-drawer-overlay.open{display:block;}
  .admin-sidebar{position:fixed;top:0;left:0;height:100%;width:80%;max-width:290px;z-index:65;padding:20px 14px;overflow-y:auto;transform:translateX(-105%);transition:transform .25s ease;display:block;}
  .admin-sidebar.open{transform:translateX(0);}
  .admin-sidebar .group-label{display:block;}
  .admin-main{padding:70px 16px 26px;}
}
</style>
</head>

<div id="app"></div>

function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);}
function slugify(s){return (s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')||uid();}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtMoney(n){ if(n===''||n==null||isNaN(n)) return ''; return 'Rs. '+Number(n).toLocaleString(); }
function isValidHttpUrl(u){ try{ const x=new URL(u); return x.protocol==='http:'||x.protocol==='https:'; }catch(e){ return false; } }

let SETTINGS = null, PRODUCTS = [], CATEGORIES = [], FLASHSALES = [], BANNERS = [], MEDIA = [], PAGES = [];

let PD_ACTIVE_IMG = 0;

async function loadKey(key, fallback){
  try{
    const snap = await FIREBASE_DB.ref(FIREBASE_ROOT+'/'+key).once('value');
    const val = snap.val();
    if(val !== null && val !== undefined) return val;
    const local = localStorage.getItem(key);
    if(local){
      const parsed = JSON.parse(local);
      await FIREBASE_DB.ref(FIREBASE_ROOT+'/'+key).set(parsed);
      return parsed;
    }
    return fallback;
  }catch(e){
    console.error('Firebase load failed:', key, e);
    try{ const local=localStorage.getItem(key); return local?JSON.parse(local):fallback; }
    catch(_){ return fallback; }
  }
}
async function saveKey(key, val){
  try{
    await FIREBASE_DB.ref(FIREBASE_ROOT+'/'+key).set(val);
    try{ localStorage.setItem(key, JSON.stringify(val)); }catch(_){}
    applyTheme();
    render();
  }catch(e){
    console.error('Firebase save failed:', key, e);
    try{ localStorage.setItem(key, JSON.stringify(val)); }catch(_){}
    toast('Could not sync with Firebase. Check database rules/connection.');
  }
}

let FIREBASE_LISTENERS_STARTED = false;
function startFirebaseRealtimeSync(){
  if(FIREBASE_LISTENERS_STARTED) return;
  FIREBASE_LISTENERS_STARTED = true;
  const applyRemote = (key, value) => {
    if(value === null || value === undefined) return;
    try{
      if(key===KEYS.settings){
        SETTINGS = Object.assign({}, DEFAULT_SETTINGS, value, {
          hero:Object.assign({},DEFAULT_SETTINGS.hero,value.hero||{}),
          footer:Object.assign({},DEFAULT_SETTINGS.footer,value.footer||{},
            {social:Object.assign({},DEFAULT_SETTINGS.footer.social,(value.footer&&value.footer.social)||{})})
        });
        applyTheme(); injectGA();
      } else if(key===KEYS.products) PRODUCTS = Array.isArray(value)?value:Object.values(value||{});
      else if(key===KEYS.categories) CATEGORIES = Array.isArray(value)?value:Object.values(value||{});
      else if(key===KEYS.flashsales) FLASHSALES = Array.isArray(value)?value:Object.values(value||{});
      else if(key===KEYS.banners) BANNERS = Array.isArray(value)?value:Object.values(value||{});
      else if(key===KEYS.media) MEDIA = Array.isArray(value)?value:Object.values(value||{});
      else if(key===KEYS.pages) PAGES = Array.isArray(value)?value:Object.values(value||{});
      try{ localStorage.setItem(key, JSON.stringify(value)); }catch(_){}
      render();
    }catch(e){ console.error('Firebase realtime update failed:', key, e); }
  };
  Object.values(KEYS).forEach(key=>{
    FIREBASE_DB.ref(FIREBASE_ROOT+'/'+key).on('value', snap=>applyRemote(key, snap.val()));
  });
}

async function boot(){
  SETTINGS = await loadKey(KEYS.settings, DEFAULT_SETTINGS);
  SETTINGS = Object.assign({}, DEFAULT_SETTINGS, SETTINGS, {
    hero:Object.assign({},DEFAULT_SETTINGS.hero,SETTINGS.hero||{}),
    footer:Object.assign({},DEFAULT_SETTINGS.footer,SETTINGS.footer||{},{social:Object.assign({},DEFAULT_SETTINGS.footer.social,(SETTINGS.footer&&SETTINGS.footer.social)||{})})
  });
  PRODUCTS = await loadKey(KEYS.products, []);
  CATEGORIES = await loadKey(KEYS.categories, seedCategories());
  FLASHSALES = await loadKey(KEYS.flashsales, []);
  BANNERS = await loadKey(KEYS.banners, []);
  MEDIA = await loadKey(KEYS.media, []);
  PAGES = await loadKey(KEYS.pages, seedPages());
  applyTheme();
  injectGA();
  window.addEventListener('hashchange', render);
  render();
  startFirebaseRealtimeSync();
}

function seedCategories(){ return []; }
function seedPages(){
  return [
    {id:uid(),title:'About Us',slug:'about',content:'Tell your customers about Store.X here. Edit this from the admin panel.',status:'published'},
    {id:uid(),title:'Privacy Policy',slug:'privacy-policy',content:'Your privacy policy content goes here.',status:'published'},
    {id:uid(),title:'Terms & Conditions',slug:'terms',content:'Your terms and conditions go here.',status:'published'},
    {id:uid(),title:'Disclaimer',slug:'disclaimer',content:'Store.X is a product discovery site. All purchases are completed on Daraz; Store.X is not the seller of record.',status:'published'}
  ];
}

function applyTheme(){
  if(!SETTINGS) return;
  document.documentElement.style.setProperty('--primary', SETTINGS.primaryColor||'#F57224');
  document.documentElement.style.setProperty('--header-bg', SETTINGS.headerBg||'#FFFFFF');
  document.documentElement.style.setProperty('--header-text', SETTINGS.headerText||'#1F2328');
  document.title = SETTINGS.siteName || 'Store.X';
}

function injectGA(){
  if(!SETTINGS.gaId) return;
  if(document.getElementById('ga-script')) return;
  const s1=document.createElement('script'); s1.id='ga-script'; s1.async=true; s1.src='https://www.googletagmanager.com/gtag/js?id='+encodeURIComponent(SETTINGS.gaId);
  const s2=document.createElement('script'); s2.text="window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js', new Date());gtag('config','"+SETTINGS.gaId.replace(/[^A-Za-z0-9\-_]/g,'')+"');";
  document.head.appendChild(s1); document.head.appendChild(s2);
}

function mediaSrc(id){ if(!id) return ''; const m=MEDIA.find(x=>x.id===id); return m? m.dataUrl : (typeof id==='string' && (id.startsWith('data:')||id.startsWith('http')) ? id : ''); }

/* ---------- SEO (hidden meta tags, invisible to shoppers) ---------- */
function setMetaTag(name, content){
  let el = document.querySelector(`meta[name="${name}"]`);
  if(!el){ el=document.createElement('meta'); el.setAttribute('name',name); document.head.appendChild(el); }
  el.setAttribute('content', content||'');
}
function applySEO(seo, fallbackTitle, fallbackDesc){
  const siteName = (SETTINGS&&SETTINGS.siteName)||'Store.X';
  document.title = (seo&&seo.title) ? seo.title : (fallbackTitle? fallbackTitle+' | '+siteName : siteName);
  setMetaTag('description', (seo&&seo.description) || fallbackDesc || (SETTINGS&&SETTINGS.footer&&SETTINGS.footer.about) || '');
  setMetaTag('keywords', (seo&&seo.keywords) || '');
}
function resetDefaultSEO(){ applySEO(null, ''); }

function toast(msg){
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(),2400);
}

function closeModal(){
  const m = document.getElementById('modal-overlay');
  if(m) m.remove();
}

function showModal(contentHtml){
  closeModal();
  const el = document.createElement('div');
  el.id = 'modal-overlay';
  el.className = 'modal-overlay';
  el.innerHTML = `<div class="modal-box">${contentHtml}</div>`;
  document.body.appendChild(el);
}


/* ================= ROUTER ================= */
function route(){ return location.hash.replace(/^#/,'') || '/'; }

function render(){
  const h = route();
  const app = document.getElementById('app');
  if(h.startsWith('/admin-of-storex')){
    app.innerHTML = renderAdminRoot();
    wireAdminEvents();
    return;
  }
  let body='';
  resetDefaultSEO();
  if(h==='/' || h===''){ body = renderHome(); }
  else if(h.startsWith('/product/')){ body = renderProductPage(decodeURIComponent(h.split('/product/')[1])); }
  else if(h.startsWith('/category/')){ body = renderCategoryPage(decodeURIComponent(h.split('/category/')[1])); }
  else if(h.startsWith('/flash-sale/')){ body = renderFlashSalePage(decodeURIComponent(h.split('/flash-sale/')[1])); }
  else if(h==='/flash-sale'){ body = renderFlashSaleIndex(); }
  else if(h.startsWith('/search')){ const q = new URLSearchParams(h.split('?')[1]||'').get('q')||''; body = renderSearchPage(q); }
  else if(h.startsWith('/page/')){ body = renderCustomPage(decodeURIComponent(h.split('/page/')[1])); }
  else { body = renderNotFound(); }

  app.innerHTML = renderHeader() + '<main>'+body+'</main>' + renderFooter() + renderMobileDrawer();
  window.scrollTo(0,0);
  wireStorefrontEvents();
  startCountdowns();
  initHeroSlider();
  initFlashCarousels();
  initFlashVisuals();
}

  <header id="site-header">
    <div class="container header-row">
      <div class="logo-wrap"><a href="${esc(SETTINGS.logoLink||'#/')}">${logo}</a></div>
      <button class="mobile-toggle" onclick="MOBILE_DRAWER_OPEN=true;render();" aria-label="Open menu">

          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </button>
      </form>
      <button class="mobile-search-toggle" onclick="MOBILE_SEARCH_OPEN=!MOBILE_SEARCH_OPEN;render();" aria-label="Toggle search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>

function renderMobileDrawer(){
  if(!MOBILE_DRAWER_OPEN) return '';
  const navLinks = SETTINGS.nav.map(n=>`<a href="${esc(n.url)}" onclick="MOBILE_DRAWER_OPEN=false;">${esc(n.label)}</a>`).join('');
  return `<div class="mobile-drawer open" onclick="if(event.target===this){MOBILE_DRAWER_OPEN=false;render();}">
    <div class="mobile-drawer-panel">
      <button class="mobile-drawer-close" onclick="MOBILE_DRAWER_OPEN=false;render();">&times;</button>
      <div style="clear:both;height:8px;"></div>

}

  const socialIcons = {facebook:'f',instagram:'\u25CE',tiktok:'\u266A',youtube:'\u25B6',whatsapp:'\u260E',twitter:'X'};

/* ================= HOME / SECTIONS ================= */
function activeFlashSales(){
  const now = Date.now();
  return FLASHSALES.filter(f=>f.status==='active' && (!f.end || new Date(f.end).getTime()>now));
}
function renderHome(){
  return SETTINGS.sections.filter(s=>s.visible).map(renderSection).join('');
}
function renderSection(sec){
  switch(sec.type){
    case 'hero': return renderHero();
    case 'flashsale': return renderFlashSaleSection(sec);
    case 'categories': return renderCategoriesSection(sec);
    case 'productCollection': return renderCollectionSection(sec);
    case 'categoryShowcase': return renderCategoryShowcaseSection(sec);
    case 'banner': return renderBannerSection(sec);
    case 'customHtml': return `<section class="section container">${sec.config&&sec.config.html||''}</section>`;
    default: return '';
  }
}

function heroSlides(){
  const h = SETTINGS.hero;
  const slides = [];
  const heroDesktop = h.desktopImage || h.image;
  const heroMobile = h.mobileImage || h.image;
  if(heroDesktop || heroMobile){ slides.push({desktop:heroDesktop, mobile:heroMobile}); }
  BANNERS.filter(b=>b.visible && b.heroSlider && (b.image||b.desktopImage||b.mobileImage)).forEach(b=>{
    slides.push({desktop:b.desktopImage||b.image, mobile:b.mobileImage||b.image});
  });
  return slides;
}

function renderHero(){
  const h = SETTINGS.hero;
  if(!h.enabled) return '';
  const slides = heroSlides();
  const bg = slides.length ? `<div class="hero-bg">${slides.map((s,i)=>`
    <div class="hero-bg-slide ${i===0?'active':''}" data-i="${i}">
      ${s.desktop?`<div class="hero-bg-desktop" style="background-image:url('${mediaSrc(s.desktop)}')"></div>`:''}
      ${s.mobile?`<div class="hero-bg-mobile" style="background-image:url('${mediaSrc(s.mobile)}')"></div>`:''}
    </div>`).join('')}</div>` : '';
  const btnAlignMap = {left:'flex-start',center:'center',right:'flex-end'};
  const btnStyle = [
    h.buttonBgColor?`background:${esc(h.buttonBgColor)}`:'',
    h.buttonTextColor?`color:${esc(h.buttonTextColor)}`:'',
    h.buttonWidth?`width:${Number(h.buttonWidth)}px`:'',
    `padding:${Number(h.buttonPaddingY)||12}px ${Number(h.buttonPaddingX)||22}px`,
    `margin-top:${Number(h.buttonMarginTop)||0}px`,
    `align-self:${btnAlignMap[h.buttonAlign]||'flex-start'}`
  ].filter(Boolean).join(';');
  return `
  <section class="hero" style="min-height:${h.height}px;--hero-overlay:${h.overlay};">
    ${bg}<div class="hero-overlay"></div>
    <div class="hero-inner align-${h.align}">
      <h1>${esc(h.heading)}</h1>
      <p>${esc(h.subheading)}</p>
      ${h.buttonText? `<a class="btn" style="${btnStyle}" href="${esc(h.buttonUrl||'#/')}">${esc(h.buttonText)}</a>`:''}
    </div>
  </section>`;
}

let HERO_SLIDER_TIMER = null;
function initHeroSlider(){
  if(HERO_SLIDER_TIMER){ clearInterval(HERO_SLIDER_TIMER); HERO_SLIDER_TIMER=null; }
  const wrap = document.querySelector('.hero-bg');
  if(!wrap) return;
  const slides = wrap.querySelectorAll('.hero-bg-slide');
  if(slides.length<2) return;
  let idx = 0;
  HERO_SLIDER_TIMER = setInterval(()=>{
    slides[idx].classList.remove('active');
    idx = (idx+1) % slides.length;
    slides[idx].classList.add('active');
  }, 5000);
}

function flashImages(f){
  return [f.banner, f.banner2, f.banner3].filter(Boolean).map(mediaSrc).filter(Boolean);
}
function flashVisualHtml(images){
  if(!images.length) return `<div class="flash-visual"></div>`;
  if(images.length===1) return `<div class="flash-visual" style="background-image:url('${images[0]}')"></div>`;
  return `<div class="flash-visual flash-visual-auto" data-images='${esc(JSON.stringify(images))}'>
    ${images.map((src,i)=>`<div class="flash-visual-slide ${i===0?'active':''}" style="background-image:url('${src}')"></div>`).join('')}
  </div>`;
}
let FLASH_VISUAL_TIMERS = [];
function initFlashVisuals(){
  FLASH_VISUAL_TIMERS.forEach(t=>clearInterval(t));
  FLASH_VISUAL_TIMERS = [];
  document.querySelectorAll('.flash-visual-auto').forEach(el=>{
    const slides = el.querySelectorAll('.flash-visual-slide');
    if(slides.length<2) return;
    let idx = 0;
    const timer = setInterval(()=>{
      slides[idx].classList.remove('active');
      idx = (idx+1) % slides.length;
      slides[idx].classList.add('active');
    }, 3000);
    FLASH_VISUAL_TIMERS.push(timer);
  });
}

function flashSlideHtml(f){
  return `<a href="#/flash-sale/${esc(f.slug)}" class="flash-slide">
      <div class="flash">
        ${flashVisualHtml(flashImages(f))}
        <div class="flash-info">
          <span class="flash-eyebrow">Flash Sale</span>
          <h3>${esc(f.title)}</h3>
          <p>${esc(f.subtitle||'')}</p>
          <div class="countdown" data-countdown="${esc(f.end||'')}" data-ended-text="Sale ended">
            <div class="chip"><b class="d">00</b><span>Days</span></div>
            <div class="chip"><b class="h">00</b><span>Hrs</span></div>
            <div class="chip"><b class="m">00</b><span>Min</span></div>
            <div class="chip"><b class="s">00</b><span>Sec</span></div>
          </div>
        </div>
      </div>
    </a>`;
}

function renderFlashSaleSection(sec){
  const cfg = sec.config||{};
  let sales;
  if(cfg.flashSaleId){
    const chosen = FLASHSALES.find(f=>f.id===cfg.flashSaleId && f.status==='active');
    sales = chosen ? [chosen] : [];
  } else {
    sales = activeFlashSales();
  }
  if(!sales.length){ return ''; }
  const allActive = activeFlashSales();
  return `<section class="section container">
    <div class="section-head"><div><h2>${esc(sec.title||'Flash Sale')}</h2><p>${esc(sec.subtitle||'')}</p></div>
    ${allActive.length>1?`<a href="#/flash-sale">See all flash sales</a>`:''}</div>
    <div class="flash-carousel" data-sec="${sec.id}">
      <div class="flash-track">${sales.map(flashSlideHtml).join('')}</div>
      ${sales.length>1?`<div class="flash-dots">${sales.map((f,i)=>`<button type="button" data-dot="${i}" class="${i===0?'active':''}" aria-label="Show flash sale ${i+1}"></button>`).join('')}</div>`:''}
    </div>
  </section>`;
}

let FLASH_CAROUSEL_TIMERS = [];
function initFlashCarousels(){
  FLASH_CAROUSEL_TIMERS.forEach(t=>clearInterval(t));
  FLASH_CAROUSEL_TIMERS = [];
  document.querySelectorAll('.flash-carousel').forEach(wrap=>{
    const track = wrap.querySelector('.flash-track');
    const slides = wrap.querySelectorAll('.flash-slide');
    const dots = wrap.querySelectorAll('.flash-dots button');
    if(!track || slides.length<2) return;
    let idx = 0;
    const goTo = (i)=>{
      idx = i;
      track.style.transform = `translateX(-${idx*100}%)`;
      dots.forEach((d,di)=>d.classList.toggle('active', di===idx));
    };
    dots.forEach(d=>d.addEventListener('click', (e)=>{ e.preventDefault(); goTo(Number(d.getAttribute('data-dot'))); }));
    const timer = setInterval(()=>{ goTo((idx+1) % slides.length); }, 5000);
    FLASH_CAROUSEL_TIMERS.push(timer);
  });
}

function buyOnDaraz(productId, customUrl){
  let url = customUrl;
  let prod = null;
  if(!url){ prod = PRODUCTS.find(p=>p.id===productId); url = prod && prod.darazUrl; }
  if(!url || !isValidHttpUrl(url)){ toast('This product has no valid Daraz link yet'); return; }
  if(prod){ prod.clicks = (prod.clicks||0)+1; saveKey(KEYS.products, PRODUCTS); }
  window.open(url, '_blank', 'noopener');
}

/* ================= COUNTDOWN ================= */
let COUNTDOWN_TIMER = null;
function startCountdowns(){
  if(COUNTDOWN_TIMER) clearInterval(COUNTDOWN_TIMER);
  const tick = ()=>{
    document.querySelectorAll('[data-countdown]').forEach(el=>{
      const end = el.getAttribute('data-countdown');
      if(!end) return;
      const diff = new Date(end).getTime() - Date.now();
      if(diff<=0){ el.innerHTML = '<div class="chip" style="min-width:auto;padding:8px 14px;">Sale ended</div>'; return; }
      const d = Math.floor(diff/86400000), h=Math.floor(diff/3600000)%24, m=Math.floor(diff/60000)%60, s=Math.floor(diff/1000)%60;
      const dEl=el.querySelector('.d'),hEl=el.querySelector('.h'),mEl=el.querySelector('.m'),sEl=el.querySelector('.s');
      if(dEl){dEl.textContent=String(d).padStart(2,'0');hEl.textContent=String(h).padStart(2,'0');mEl.textContent=String(m).padStart(2,'0');sEl.textContent=String(s).padStart(2,'0');}
    });
  };
  tick(); COUNTDOWN_TIMER = setInterval(tick,1000);
}

function duplicateProduct(id){
  const p = PRODUCTS.find(x=>x.id===id); if(!p) return;
  const copy = JSON.parse(JSON.stringify(p));
  copy.id = uid(); copy.title = p.title+' (Copy)'; copy.seo = Object.assign({},p.seo,{slug: slugify(copy.title)+'-'+uid().slice(0,4)});
  PRODUCTS.push(copy); saveKey(KEYS.products,PRODUCTS); toast('Product duplicated');
}

function deleteProduct(id){
  if(!confirm('Delete this product? This cannot be undone.')) return;

}

function addProductImage(pid, mediaId, isNew){
  let p = isNew ? window.__draftProduct : PRODUCTS.find(x=>x.id===pid);
  if(!p) return;
  p.images = p.images||[];
  p.images.push(mediaId);
  if(!p.mainImage) p.mainImage = mediaId;
  if(!isNew) saveKey(KEYS.products,PRODUCTS);
  const list = document.getElementById('product-img-list-'+pid);
  if(list){ list.innerHTML = p.images.map(im=>`<div class="t ${p.mainImage===im?'sel':''}" onclick="setMainProductImage('${pid}','${im}',${isNew})"><img src="${mediaSrc(im)}"></div>`).join(''); }
}

function setMainProductImage(pid, mediaId, isNew){
  let p = isNew ? window.__draftProduct : PRODUCTS.find(x=>x.id===pid);
  if(!p) return; p.mainImage = mediaId;
  const list = document.getElementById('product-img-list-'+pid);
  if(list){ list.innerHTML = p.images.map(im=>`<div class="t ${p.mainImage===im?'sel':''}" onclick="setMainProductImage('${pid}','${im}',${isNew})"><img src="${mediaSrc(im)}"></div>`).join(''); }
}

function saveProductForm(pid, isNew){
  const form = document.getElementById('product-form');
  const fd = new FormData(form);
  const draft = isNew ? window.__draftProduct : PRODUCTS.find(x=>x.id===pid);
  const title = fd.get('title').trim();
  const darazUrl = fd.get('darazUrl').trim();
  if(!isValidHttpUrl(darazUrl)){ toast('Please enter a valid http(s) Daraz URL'); return; }
  Object.assign(draft, {
    title, shortTitle: fd.get('shortTitle').trim(), sku: fd.get('sku').trim(),
    shortDesc: fd.get('shortDesc').trim(), fullDesc: fd.get('fullDesc').trim(),
    category: fd.get('category'), tags: fd.get('tags').split(',').map(t=>t.trim()).filter(Boolean),
    price: fd.get('price')?Number(fd.get('price')):'', oldPrice: fd.get('oldPrice')?Number(fd.get('oldPrice')):'',
    discount: fd.get('discount')?Number(fd.get('discount')):'', badge: fd.get('badge').trim(),
    darazUrl, status: fd.get('status'), order: Number(fd.get('order'))||0,
    featured: fd.get('featured')==='on', trending: fd.get('trending')==='on', newArrival: fd.get('newArrival')==='on', bestSeller: fd.get('bestSeller')==='on',
    seo: { slug: slugify(fd.get('seoSlug').trim() || title), title: fd.get('seoTitle').trim(), keywords: fd.get('seoKeywords').trim(), description: fd.get('seoDescription').trim() }
  });
  if(isNew){ PRODUCTS.push(draft); window.__draftProduct=null; }
  saveKey(KEYS.products, PRODUCTS);
  closeModal(); toast('Product saved and synchronized');
}

function renderFlashProductsList(f){
  if(!f.products || !f.products.length) return '<p style="font-size:13px;color:var(--ink-soft);">No products added yet.</p>';
  return f.products.map((entry,i)=>{
    const label = entry.type==='existing' ? (PRODUCTS.find(p=>p.id===entry.productId)||{}).title || 'Unknown product' : entry.title+' (custom)';
    return `<div class="section-list-item" style="cursor:default;"><span class="meta"><b>${esc(label)}</b></span><button type="button" class="btn small danger" onclick="removeFlashProduct('${f.id}',${i})">Remove</button></div>`;
  }).join('');
}

function getFlashDraft(id, isNew){ return isNew ? window.__draftFlash : FLASHSALES.find(x=>x.id===id); }

function addExistingToFlash(id, isNew){
  const f = getFlashDraft(id,isNew); const sel = document.getElementById('flash-existing-select');
  if(!sel.value) return;
  f.products = f.products||[]; f.products.push({type:'existing', productId: sel.value});
  document.getElementById('flash-products-list').innerHTML = renderFlashProductsList(f);
}

function addCustomFlashProduct(id, isNew){
  const f = getFlashDraft(id,isNew);
  const title = prompt('Custom product title:'); if(!title) return;
  const price = prompt('Price (optional):','') || '';
  const darazUrl = prompt('Daraz URL:','') || '';
  f.products = f.products||[]; f.products.push({type:'custom', title, price: price?Number(price):'', darazUrl, image:null, desc:'', oldPrice:'', discount:'', badge:''});
  document.getElementById('flash-products-list').innerHTML = renderFlashProductsList(f);
}

function removeFlashProduct(id, idx){
  const isNewCheck = !FLASHSALES.find(x=>x.id===id);
  const f = getFlashDraft(id, isNewCheck);
  f.products.splice(idx,1);
  document.getElementById('flash-products-list').innerHTML = renderFlashProductsList(f);
}

function saveFlashForm(id, isNew){
  const form = document.getElementById('flash-form'); const fd = new FormData(form);
  const draft = getFlashDraft(id,isNew);
  if(!draft.banner){ toast('Please add Flash Sale Image 1 (it is required)'); return; }
  const title = fd.get('title').trim();
  Object.assign(draft,{
    title, slug: slugify(fd.get('slug').trim()||title), subtitle: fd.get('subtitle').trim(),
    start: fd.get('start'), end: fd.get('end'), status: fd.get('status'), description: fd.get('description').trim(),
    seo: { title: fd.get('seoTitle').trim(), keywords: fd.get('seoKeywords').trim(), description: fd.get('seoDescription').trim() }
  });
  if(isNew){ FLASHSALES.push(draft); window.__draftFlash=null; }
  saveKey(KEYS.flashsales, FLASHSALES); closeModal(); toast('Flash sale saved');
}

/* ---------- Homepage Builder ---------- */
let DRAG_IDX = null;
function adminHomepage(){
  const items = SETTINGS.sections.map((s,i)=>`
    <div class="section-list-item" draggable="true" data-idx="${i}" ondragstart="DRAG_IDX=${i};this.classList.add('dragging');" ondragend="this.classList.remove('dragging');" ondragover="event.preventDefault();" ondrop="reorderSection(${i});">
      <span class="handle">\u2630</span>
      <span class="meta"><b>${esc(s.title||sectionTypeLabel(s.type))}</b><div>${sectionTypeLabel(s.type)}${s.visible?'':' \u2022 hidden'}</div></span>
      <div class="row-actions">
        <button class="btn small ghost" onclick="toggleSectionVisible(${i})">${s.visible?'Hide':'Show'}</button>
        <button class="btn small ghost" onclick="editSectionModal(${i})">Edit</button>
        <button class="btn small ghost" onclick="duplicateSection(${i})">Duplicate</button>
        <button class="btn small danger" onclick="removeSection(${i})">Delete</button>
      </div>
    </div>`).join('');
  return `<div class="admin-topbar"><h1>Homepage Builder</h1><button class="btn" onclick="addSectionModal()">+ Add Section</button></div>
  <div class="help-note">Drag sections by the \u2630 handle to reorder them. All changes apply live across your store immediately.</div>
  <div class="admin-card">${items || '<p style="color:var(--ink-soft);font-size:13.5px;">No sections yet.</p>'}</div>`;
}

function sectionTypeLabel(t){ return {hero:'Hero banner',flashsale:'Flash sale',categories:'Categories',productCollection:'Product collection',categoryShowcase:'Products by category (auto)',banner:'Promotional banner',customHtml:'Custom text/HTML'}[t]||t; }

function reorderSection(dropIdx){
  if(DRAG_IDX===null || DRAG_IDX===dropIdx) return;
  const arr = SETTINGS.sections; const [moved] = arr.splice(DRAG_IDX,1); arr.splice(dropIdx,0,moved);
  DRAG_IDX=null; saveKey(KEYS.settings,SETTINGS);
}

function toggleSectionVisible(i){ SETTINGS.sections[i].visible = !SETTINGS.sections[i].visible; saveKey(KEYS.settings,SETTINGS); }
function duplicateSection(i){ const copy=JSON.parse(JSON.stringify(SETTINGS.sections[i])); copy.id=uid(); SETTINGS.sections.splice(i+1,0,copy); saveKey(KEYS.settings,SETTINGS); }
function removeSection(i){ if(!confirm('Delete this section?')) return; SETTINGS.sections.splice(i,1); saveKey(KEYS.settings,SETTINGS); }

function addSectionModal(){
  showModal(`<h2>Add Section</h2>
    <div class="form-grid">
      ${['hero','flashsale','categories','productCollection','categoryShowcase','banner','customHtml'].map(t=>`<button type="button" class="btn ghost" style="justify-content:flex-start;" onclick="${t==='flashsale'?'addFlashSaleSectionModal()':`addSection('${t}')`}">+ ${sectionTypeLabel(t)}</button>`).join('')}
    </div>
    <div class="modal-close-row"><button type="button" class="btn ghost" onclick="closeModal()">Close</button></div>`);
}

function addSection(type){
  const base = {id:uid(),type,visible:true,title:sectionTypeLabel(type),subtitle:''};
  if(type==='flashsale') base.config={flashSaleId:''};
  if(type==='productCollection') base.config={filter:'all',count:6,layout:'grid',columns:3,productId:''};
  if(type==='categoryShowcase') base.config={count:3};
  if(type==='banner') base.config={bannerId: BANNERS[0]?BANNERS[0].id:''};
  if(type==='customHtml') base.config={html:'<p>Your custom content here.</p>'};
  SETTINGS.sections.push(base); saveKey(KEYS.settings,SETTINGS); closeModal();
}

function addFlashSaleSectionModal(){
  const options = FLASHSALES.map(f=>`<option value="${f.id}">${esc(f.title)}</option>`).join('');
  showModal(`<h2>Add Flash Sale Section</h2>
    <form onsubmit="event.preventDefault(); createFlashSaleSection(this);">
      <div class="form-grid">
        <div class="field full"><label>Which Flash Sale</label><select name="flashSaleId"><option value="">Auto (show all active flash sales)</option>${options}</select></div>
        <div class="field full"><label>Select Flash Sale Placement / Position</label>
          <select name="position">
            <option value="0">Top Flash Sale (1st position)</option>
            <option value="1">2nd position</option>
            <option value="2">3rd position</option>
            <option value="3">4th position</option>
            <option value="bottom" selected>Bottom Flash Sale (end of homepage)</option>
          </select>
        </div>
      </div>
      <div class="modal-close-row"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn">Add Section</button></div>
    </form>`);
}

function insertSectionAtPosition(section, position){
  const arr = SETTINGS.sections;
  if(position==='bottom'){ arr.push(section); return; }
  const idx = Math.max(0, Math.min(Number(position)||0, arr.length));
  arr.splice(idx, 0, section);
}

function createFlashSaleSection(form){
  const fd = new FormData(form);
  const base = {id:uid(),type:'flashsale',visible:true,title:sectionTypeLabel('flashsale'),subtitle:'',config:{flashSaleId: fd.get('flashSaleId')||''}};
  insertSectionAtPosition(base, fd.get('position'));
  saveKey(KEYS.settings,SETTINGS); closeModal(); toast('Flash sale section added at the selected position');
}

function editSectionModal(i){
  const s = SETTINGS.sections[i];
  let extra = '';
  if(s.type==='productCollection'){
    const layout = s.config.layout||'grid';
    extra = `<div class="field"><label>Layout</label><select name="layout" onchange="document.getElementById('pc-grid-fields').style.display=this.value==='grid'?'contents':'none';document.getElementById('pc-spotlight-fields').style.display=this.value==='spotlight'?'block':'none';"><option value="grid" ${layout==='grid'?'selected':''}>Grid (multiple products)</option><option value="spotlight" ${layout==='spotlight'?'selected':''}>Spotlight (1 big product)</option></select></div>
    <div class="field"><label>Filter</label><select name="filter"><option value="all" ${s.config.filter==='all'?'selected':''}>All published</option><option value="featured" ${s.config.filter==='featured'?'selected':''}>Featured</option><option value="trending" ${s.config.filter==='trending'?'selected':''}>Trending</option><option value="newArrival" ${s.config.filter==='newArrival'?'selected':''}>New arrivals</option><option value="bestSeller" ${s.config.filter==='bestSeller'?'selected':''}>Best sellers</option></select></div>
    <div id="pc-grid-fields" style="display:${layout==='grid'?'contents':'none'};">
      <div class="field"><label>Number of products</label><input type="number" name="count" value="${s.config.count||6}"></div>
      <div class="field"><label>Columns per row</label><select name="columns"><option value="2" ${Number(s.config.columns)===2?'selected':''}>2</option><option value="3" ${(!s.config.columns||Number(s.config.columns)===3)?'selected':''}>3</option><option value="4" ${Number(s.config.columns)===4?'selected':''}>4</option></select></div>
    </div>
    <div id="pc-spotlight-fields" class="field full" style="display:${layout==='spotlight'?'block':'none'};">
      <label>Which product (spotlight)</label>
      <select name="productId"><option value="">Auto (first match of filter above)</option>${PRODUCTS.map(p=>`<option value="${p.id}" ${s.config.productId===p.id?'selected':''}>${esc(p.shortTitle||p.title)}</option>`).join('')}</select>
    </div>`;
  } else if(s.type==='flashsale'){
    const fsOptions = FLASHSALES.map(f=>`<option value="${f.id}" ${(s.config&&s.config.flashSaleId)===f.id?'selected':''}>${esc(f.title)}</option>`).join('');
    extra = `<div class="field full"><label>Which Flash Sale</label><select name="flashSaleId"><option value="">Auto (show all active flash sales, carousel if 2+)</option>${fsOptions}</select></div>
    <div class="field full"><label>Select Flash Sale Placement / Position</label>
      <select name="position" onchange="moveSectionToPosition(${i}, this.value);">
        <option value="">\u2014 Keep current position \u2014</option>
        <option value="0">Top Flash Sale (1st position)</option>
        <option value="1">2nd position</option>
        <option value="2">3rd position</option>
        <option value="3">4th position</option>
        <option value="bottom">Bottom Flash Sale (end of homepage)</option>
      </select>
    </div>`;
  } else if(s.type==='categoryShowcase'){
    extra = `<div class="field"><label>Products per category</label><input type="number" name="count" value="${(s.config&&s.config.count)||3}"></div>`;
  } else if(s.type==='banner'){
    extra = `<div class="field full"><label>Which banner</label><select name="bannerId">${BANNERS.map(b=>`<option value="${b.id}" ${s.config.bannerId===b.id?'selected':''}>${esc(b.heading||b.id)}</option>`).join('')||'<option value="">No banners yet</option>'}</select></div>`;
  } else if(s.type==='customHtml'){
    extra = `<div class="field full"><label>Content</label><textarea name="html" style="min-height:120px;">${esc(s.config.html||'')}</textarea></div>`;
  }
  showModal(`<h2>Edit Section</h2>
    <form id="section-form" onsubmit="event.preventDefault(); saveSectionForm(${i});">
      <div class="form-grid">
        <div class="field"><label>Section title</label><input type="text" name="title" value="${esc(s.title||'')}"></div>
        <div class="field"><label>Subtitle</label><input type="text" name="subtitle" value="${esc(s.subtitle||'')}"></div>
        ${extra}
      </div>
      <div class="modal-close-row"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn">Save</button></div>
    </form>`);
}

function moveSectionToEdge(i,where){
  const arr = SETTINGS.sections; const [moved] = arr.splice(i,1);
  if(where==='top') arr.unshift(moved); else arr.push(moved);
  saveKey(KEYS.settings,SETTINGS); closeModal(); toast('Section moved to '+where);
}

function moveSectionToPosition(i, position){
  if(position===''||position==null) return;
  const arr = SETTINGS.sections; const [moved] = arr.splice(i,1);
  insertSectionAtPosition(moved, position);
  saveKey(KEYS.settings,SETTINGS); closeModal(); toast('Flash sale section moved to the selected position');
}

function saveSectionForm(i){
  const form=document.getElementById('section-form'); const fd=new FormData(form);
  const s = SETTINGS.sections[i];
  s.title = fd.get('title'); s.subtitle = fd.get('subtitle');
  if(s.type==='flashsale'){ s.config = {flashSaleId: fd.get('flashSaleId')||''}; }
  if(s.type==='productCollection'){ s.config = {filter:fd.get('filter'), count:Number(fd.get('count'))||6, layout:fd.get('layout')||'grid', columns:Number(fd.get('columns'))||3, productId:fd.get('productId')||''}; }
  if(s.type==='categoryShowcase'){ s.config = {count:Number(fd.get('count'))||3}; }
  if(s.type==='banner'){ s.config = {bannerId: fd.get('bannerId')}; }
  if(s.type==='customHtml'){ s.config = {html: fd.get('html')}; }
  saveKey(KEYS.settings,SETTINGS); closeModal();
}

        ${h.mobileImage?`<button type="button" class="btn small danger" style="margin-top:8px;width:100%;" onclick="SETTINGS.hero.mobileImage=null;saveKey(KEYS.settings,SETTINGS);">Remove</button>`:''}
        </div>
      </div>
      <div class="field full">
        <label>Fallback Hero Image URL (used only if the mobile/desktop images above are not set)</label>
        <div class="upload-box"><input type="url" placeholder="Fallback Hero Image URL yahan enter karein (https://...)" value="${esc(h.image||'')}" onchange="const url=this.value.trim(); SETTINGS.hero.image=url||null; saveKey(KEYS.settings,SETTINGS);">
        ${h.image?`<img src="${mediaSrc(h.image)}" style="height:70px;margin-top:8px;border-radius:6px;" id="hero-img-prev">`:''}
        ${h.image?`<button type="button" class="btn small danger" style="margin-top:8px;" onclick="SETTINGS.hero.image=null;saveKey(KEYS.settings,SETTINGS);toast('Fallback hero image removed');">Remove Fallback Image</button>`:''}
        </div>
      </div>
    </div>
    <p style="font-size:12px;color:var(--ink-soft);margin-top:10px;">The storefront automatically shows the desktop image on larger screens and the mobile image on phones, so nothing looks stretched. If you also mark banners as "Include in Hero Slider" in the Banners section, they will auto-scroll together with the hero image every 5 seconds.</p>
  </div>

  <div class="admin-card">
    <h3 style="margin-top:0;">Hero "Explore Products" Button</h3>
    <form onsubmit="event.preventDefault(); const fd=new FormData(this); Object.assign(SETTINGS.hero,{buttonText:fd.get('buttonText'),buttonUrl:fd.get('buttonUrl'),buttonBgColor:fd.get('buttonBgColor'),buttonTextColor:fd.get('buttonTextColor'),buttonWidth:fd.get('buttonWidth'),buttonPaddingY:Number(fd.get('buttonPaddingY'))||0,buttonPaddingX:Number(fd.get('buttonPaddingX'))||0,buttonMarginTop:Number(fd.get('buttonMarginTop'))||0,buttonAlign:fd.get('buttonAlign')}); saveKey(KEYS.settings,SETTINGS); toast('Hero button settings saved!');">
      <div class="form-grid">
        <div class="field"><label>Button Title / Text</label><input type="text" name="buttonText" value="${esc(h.buttonText)}"></div>
        <div class="field"><label>Target Link / URL</label><input type="text" name="buttonUrl" value="${esc(h.buttonUrl)}"></div>
        <div class="field"><label>Text Color</label><input type="text" name="buttonTextColor" value="${esc(h.buttonTextColor)}" placeholder="#FFFFFF"></div>
        <div class="field"><label>Background Color</label><input type="text" name="buttonBgColor" value="${esc(h.buttonBgColor)}" placeholder="#F57224"></div>
        <div class="field"><label>Width (px, blank = auto)</label><input type="number" name="buttonWidth" value="${esc(h.buttonWidth)}"></div>
        <div class="field"><label>Alignment</label><select name="buttonAlign"><option value="left" ${h.buttonAlign==='left'?'selected':''}>Left</option><option value="center" ${h.buttonAlign==='center'?'selected':''}>Center</option><option value="right" ${h.buttonAlign==='right'?'selected':''}>Right</option></select></div>
        <div class="field"><label>Top/Bottom Padding (Height, px)</label><input type="number" name="buttonPaddingY" value="${esc(h.buttonPaddingY)}"></div>
        <div class="field"><label>Left/Right Padding (Length, px)</label><input type="number" name="buttonPaddingX" value="${esc(h.buttonPaddingX)}"></div>
        <div class="field"><label>Margin Top (spacing above button, px)</label><input type="number" name="buttonMarginTop" value="${esc(h.buttonMarginTop)}"></div>
      </div>
      <div style="margin-top:12px;">
        <button class="btn" type="submit">Save Button Settings</button>
      </div>
    </form>
  </div>`;
}

/* ---------- Navigation ---------- */
function adminNav(){
  const rows = SETTINGS.nav.map((n,i)=>`
    <div class="section-list-item" style="cursor:default;">
      <span class="meta"><b>${esc(n.label)}</b><div>${esc(n.url)}${n.newTab?' \u2022 new tab':''}</div></span>
      <div class="row-actions">
        <button class="btn small ghost" onclick="moveNav(${i},-1)">\u2191</button>
        <button class="btn small ghost" onclick="moveNav(${i},1)">\u2193</button>
        <button class="btn small ghost" onclick="editNavItem(${i})">Edit</button>
        <button class="btn small danger" onclick="removeNavItem(${i})">Delete</button>
      </div>
    </div>`).join('');
  return `<div class="admin-topbar"><h1>Navigation</h1><button class="btn" onclick="editNavItem(-1)">+ Add Link</button></div>
  <div class="admin-card">${rows||'<p style="color:var(--ink-soft);">No nav items yet.</p>'}</div>`;
}

function moveNav(i,dir){ const arr=SETTINGS.nav; const j=i+dir; if(j<0||j>=arr.length) return; [arr[i],arr[j]]=[arr[j],arr[i]]; saveKey(KEYS.settings,SETTINGS); }
function removeNavItem(i){ SETTINGS.nav.splice(i,1); saveKey(KEYS.settings,SETTINGS); }

function editNavItem(i){
  const n = i>=0 ? SETTINGS.nav[i] : {label:'',url:'',newTab:false};
  showModal(`<h2>${i>=0?'Edit Link':'Add Link'}</h2>
    <form onsubmit="event.preventDefault(); saveNavItem(${i}, this);">
      <div class="form-grid">
        <div class="field"><label>Label</label><input required type="text" name="label" value="${esc(n.label)}"></div>
        <div class="field"><label>URL</label><input required type="text" name="url" value="${esc(n.url)}"></div>
        <div class="field full"><label class="checkline"><input type="checkbox" name="newTab" ${n.newTab?'checked':''}> Open in new tab</label></div>
      </div>
      <div class="modal-close-row"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn">Save</button></div>
    </form>`);
}

function saveNavItem(i, form){
  const fd = new FormData(form);
  const item = {id: i>=0? SETTINGS.nav[i].id : uid(), label: fd.get('label').trim(), url: fd.get('url').trim(), newTab: fd.get('newTab')==='on'};
  if(i>=0) SETTINGS.nav[i] = item; else SETTINGS.nav.push(item);
  saveKey(KEYS.settings, SETTINGS); closeModal();
}

/* ---------- Media ---------- */
function adminMedia(){
  return `<div class="admin-topbar"><h1>Media Library</h1></div>
  <div class="admin-card">
    <div class="upload-box">
      <input type="url" id="media-url-input" placeholder="Image URL yahan enter karein (https://...)" onkeydown="if(event.key==='Enter'){event.preventDefault();addMediaByUrl();}">
      <button type="button" class="btn small" style="margin-top:8px;" onclick="addMediaByUrl()">+ Add Image URL</button>
      <div class="upload-note">Paste an image URL and click "Add Image URL" to save it to your library for reuse across the site.</div>
    </div>
  </div>
  <div class="admin-card">
    ${MEDIA.length? `<div class="thumb-picker" style="gap:14px;">
      ${MEDIA.map(m=>`<div style="text-align:center;">
        <img src="${mediaSrc(m.id)}" style="width:100px;height:100px;object-fit:cover;border-radius:6px;border:1px solid var(--line);">
        <button class="btn small danger" style="margin-top:4px;width:100%;" onclick="deleteMedia('${m.id}')">Delete</button>
      </div>`).join('')}
    </div>` : '<p style="color:var(--ink-soft);">No images added yet.</p>'}
  </div>`;
}

function addMediaByUrl(){
  const input = document.getElementById('media-url-input');
  const url = input && input.value.trim();
  if(!url){ toast('Please enter an image URL'); return; }
  if(!isValidHttpUrl(url)){ toast('Please enter a valid http(s) image URL'); return; }
  MEDIA.push({id:uid(), name:url, dataUrl:url});
  saveKey(KEYS.media, MEDIA);
  toast('Image added to media library');
}

function deleteMedia(id){
  if(!confirm('Delete this image?')) return;
  MEDIA = MEDIA.filter(m=>m.id!==id);
  saveKey(KEYS.media, MEDIA);
}

/* ---------- Custom Pages ---------- */
function adminPages(){
  return `<div class="admin-topbar"><h1>Custom Pages</h1><button class="btn" onclick="openPageModal()">+ Add Page</button></div>
  <div class="admin-card">
    ${PAGES.length? `<table class="admin-table"><thead><tr><th>Title</th><th>Slug</th><th>Status</th><th>Actions</th></tr></thead><tbody>
    ${PAGES.map(p=>`<tr>
      <td>${esc(p.title)}</td><td>${esc(p.slug)}</td><td><span class="badge-status ${p.status==='published'?'on':'off'}">${p.status}</span></td>
      <td><div class="row-actions"><button class="btn small ghost" onclick="openPageModal('${p.id}')">Edit</button><button class="btn small danger" onclick="deletePage('${p.id}')">Delete</button></div></td>
    </tr>`).join('')}</tbody></table>` : '<p style="color:var(--ink-soft);">No pages yet.</p>'}
  </div>`;
}

function deletePage(id){ if(!confirm('Delete this page?')) return; PAGES=PAGES.filter(p=>p.id!==id); saveKey(KEYS.pages,PAGES); toast('Page deleted'); }

function openPageModal(id){
  const p = id ? PAGES.find(x=>x.id===id) : {id:uid(),title:'',slug:'',content:'',status:'published',image:null};
  const isNew = !id;
  showModal(`<h2>${isNew?'Add Page':'Edit Page'}</h2>
    <form onsubmit="event.preventDefault(); savePageForm('${p.id}', ${isNew}, this);">
      <div class="form-grid">
        <div class="field"><label>Title</label><input required type="text" name="title" value="${esc(p.title)}"></div>
        <div class="field"><label>Slug</label><input type="text" name="slug" value="${esc(p.slug)}"></div>
        <div class="field"><label>Status</label><select name="status"><option value="published" ${p.status==='published'?'selected':''}>Published</option><option value="draft" ${p.status==='draft'?'selected':''}>Draft</option></select></div>
        <div class="field full"><label>Content</label><textarea name="content" style="min-height:140px;">${esc(p.content)}</textarea></div>
      </div>
      <div class="modal-close-row"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn">Save Page</button></div>
    </form>`);
}

function savePageForm(id, isNew, form){
  const fd = new FormData(form);
  const title = fd.get('title').trim();
  const page = isNew ? {id, title, slug:'', content:'', status:'published'} : PAGES.find(x=>x.id===id);
  Object.assign(page, {
    title, slug: slugify(fd.get('slug').trim()||title),
    content: fd.get('content').trim(), status: fd.get('status')
  });
  if(isNew) PAGES.push(page);
  saveKey(KEYS.pages, PAGES); closeModal(); toast('Page saved');
}

/* ---------- Global Settings ---------- */
function adminSettings(){
  const s = SETTINGS;
  return `<div class="admin-topbar"><h1>General Settings</h1></div>
  <div class="admin-card">
    <form onsubmit="event.preventDefault(); saveGeneralSettings(this);">
      <div class="form-grid">
        <div class="field"><label>Site Name</label><input type="text" name="siteName" value="${esc(s.siteName)}"></div>
        <div class="field"><label>Daraz Store URL</label><input type="url" name="darazStoreUrl" value="${esc(s.darazStoreUrl)}"></div>
        <div class="field"><label>Google Analytics ID</label><input type="text" name="gaId" value="${esc(s.gaId)}"></div>
        <div class="field"><label>Admin Passcode</label><input type="text" name="adminPass" value="${esc(s.adminPass)}"></div>
        <div class="field full"><label>Footer About Text</label><textarea name="footerAbout">${esc(s.footer.about)}</textarea></div>
        <div class="field full"><label>Footer Copyright</label><input type="text" name="footerCopyright" value="${esc(s.footer.copyright)}"></div>
      </div>
      <button class="btn" style="margin-top:14px;" type="submit">Save General Settings</button>
    </form>
  </div>`;
}

function saveGeneralSettings(form){
  const fd = new FormData(form);
  SETTINGS.siteName = fd.get('siteName').trim();
  SETTINGS.darazStoreUrl = fd.get('darazStoreUrl').trim();
  SETTINGS.gaId = fd.get('gaId').trim();
  SETTINGS.adminPass = fd.get('adminPass').trim() || 'storex-admin';
  SETTINGS.footer.about = fd.get('footerAbout').trim();
  SETTINGS.footer.copyright = fd.get('footerCopyright').trim();
  saveKey(KEYS.settings, SETTINGS); toast('Settings saved');
}

function wireAdminEvents(){}

/* ================= INIT ================= */
boot();
</script>
</body>
</html>
